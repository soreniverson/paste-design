<style>
@font-face{font-family:"Geist Mono";src:url("https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-mono/GeistMono-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
.ds-btn{
  font-family:var(--ds-font);
  border:0;cursor:pointer;height:var(--ds-control-h);padding:0 28px;min-width:148px;
  border-radius:var(--ds-radius);font-size:var(--ds-text-body);font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;position:relative;
  overflow:hidden;
  transition:transform .34s cubic-bezier(.34,1.45,.64,1),background .22s ease,box-shadow .28s cubic-bezier(.22,1,.36,1);
  -webkit-tap-highlight-color:transparent;
}
.ds-btn-primary{
  background:var(--ds-accent);color:#fff;
  box-shadow:0 1px 2px rgba(31,28,26,.08),0 8px 20px -6px color-mix(in srgb,var(--ds-accent) 45%,transparent);
}
.ds-btn-primary:hover{background:var(--ds-accent-hover);transform:translateY(-1px)}
.ds-btn-primary:active{transform:scale(.97)}
.ds-btn-primary:focus-visible{outline:2px solid var(--ds-accent);outline-offset:3px}
.ds-btn-primary.is-done{
  background:var(--ds-accent-done);
  transform:scale(1.05);
  box-shadow:0 1px 2px rgba(31,28,26,.06),0 14px 28px -8px color-mix(in srgb,var(--ds-accent) 55%,transparent);
}
.ds-btn-primary.is-press{transform:scale(.965)}
.ds-btn-primary.is-pop{transform:scale(1.06)}
.ds-btn-sheen{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
  transform:translateX(-120%);
  opacity:0;
}
.ds-btn-primary.is-done .ds-btn-sheen{
  opacity:1;
  animation:btnSheen .7s cubic-bezier(.22,1,.36,1) .05s both;
}
@keyframes btnSheen{
  from{transform:translateX(-120%)}
  to{transform:translateX(120%)}
}
.ds-btn-label{
  position:relative;z-index:1;
  display:grid;place-items:center;
  min-height:1.2em;
}
.ds-btn-label>span{
  grid-area:1/1;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .28s ease,transform .42s cubic-bezier(.34,1.45,.64,1);
}
.ds-btn-idle{opacity:1;transform:none}
.ds-btn-done{
  opacity:0;transform:translateY(8px) scale(.92);
  pointer-events:none;
}
.ds-btn-primary.is-done .ds-btn-idle{
  opacity:0;transform:translateY(-8px);pointer-events:none;
}
.ds-btn-primary.is-done .ds-btn-done{
  opacity:1;transform:none;pointer-events:auto;
}
.ds-btn-done .ti{
  font-size:16px;line-height:1;
  transform:scale(.5);opacity:0;
  transition:transform .45s cubic-bezier(.34,1.45,.64,1),opacity .25s ease;
}
.ds-btn-primary.is-done .ds-btn-done .ti{
  transform:scale(1);opacity:1;
}
.preview-btn{min-width:0;padding:0 22px}
.tile-preview .ds-btn-sheen{display:none}
@media (prefers-reduced-motion:reduce){
  .ds-btn,.ds-btn-label>span,.ds-btn-done .ti{transition:none!important;animation:none!important}
  .ds-btn-primary.is-done,.ds-btn-primary.is-pop,.ds-btn-primary:hover{transform:none}
  .ds-btn-primary.is-done .ds-btn-sheen{display:none}
}
.ds-icon-btn{
  width:32px;height:32px;border:0;background:transparent;border-radius:var(--ds-radius-sm);cursor:pointer;
  font-size:18px;color:var(--ds-muted);display:grid;place-items:center;
  font-family:var(--ds-font);
}
.ds-icon-btn:hover{background:rgba(0,0,0,.05);color:var(--ds-ink)}
.ds-field{
  position:relative;display:flex;align-items:center;width:100%;height:var(--ds-field-h);
  background:var(--ds-surface);border:0.5px solid var(--ds-line);border-radius:var(--ds-radius);
  box-shadow:0 1px 2px rgba(31,28,26,.04);
  transition:box-shadow .28s var(--ds-ease),border-color .28s ease;
}
.ds-field:focus-within{
  border-color:rgba(46,107,92,.35);
  box-shadow:0 0 0 3px rgba(46,107,92,.12),0 1px 2px rgba(31,28,26,.04);
}
.tile-preview .ds-btn{transform:scale(.92);transform-origin:center;pointer-events:none}
.tile-preview .pw-field,.tile-preview .ds-field{width:min(260px,100%);transform:scale(.92);transform-origin:center}
.nice{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(280px,100%)}
.ds-soft{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--ds-font);
  user-select:none;cursor:pointer;color:var(--ds-ink);
}
.ds-soft-input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.ds-soft-track{
  position:relative;width:48px;height:28px;border-radius:999px;
  background:rgba(0,0,0,.12);flex-shrink:0;
  transition:background .5s var(--ds-ease);
  box-shadow:inset 0 0 0 0.5px var(--ds-line);
}
.ds-soft.is-on .ds-soft-track{background:var(--ds-accent)}
.ds-soft-thumb{
  position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 1px 1px rgba(0,0,0,.06);
  transition:transform .58s cubic-bezier(.34,1.45,.64,1);
  will-change:transform;
}
.ds-soft.is-on .ds-soft-thumb{transform:translateX(20px)}
.ds-soft-label{font-size:var(--ds-text-body);font-weight:500;color:var(--ds-ink)}
.ds-soft{outline:none}.ds-soft:focus{outline:none}.ds-soft-input:focus-visible + .ds-soft-track{box-shadow:inset 0 0 0 0.5px var(--ds-line),0 0 0 3px var(--ds-focus)}
.tile-preview .ds-soft{pointer-events:none;transform:scale(.92);transform-origin:center}
.soft-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}

/* Day 4: Segmented control */
.ds-seg{
  position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;
  gap:0;padding:4px;border-radius:var(--ds-radius);background:rgba(0,0,0,.06);
  box-shadow:inset 0 0 0 0.5px var(--ds-line);
  font-family:var(--ds-font);
}
.ds-seg-pill{
  position:absolute;top:4px;bottom:4px;left:4px;width:0;
  border-radius:9px;background:#fff;
  box-shadow:0 1px 2px rgba(31,28,26,.08),0 1px 1px rgba(31,28,26,.04);
  transition:transform .38s cubic-bezier(.22,1,.36,1),width .38s cubic-bezier(.22,1,.36,1);
  pointer-events:none;z-index:0;
}
.ds-seg-btn{
  position:relative;z-index:1;border:0;background:transparent;cursor:pointer;
  height:32px;padding:0 16px;min-width:72px;
  font:500 var(--ds-text-label)/1 var(--ds-font);color:var(--ds-muted);
  border-radius:9px;transition:color .2s ease;
}
.ds-seg-btn.is-active{color:var(--ds-ink)}
.ds-seg-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ds-focus)}
.seg-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.tile-preview .ds-seg{transform:scale(.92);transform-origin:center;pointer-events:none}
.tile-preview .ds-seg-btn{min-width:56px;padding:0 12px;height:28px;font-size:12px}

/* Day 5: Hold to confirm */
.ds-hold{
  position:relative;border:0;cursor:pointer;
  height:48px;min-width:196px;padding:0 32px;
  border-radius:999px;overflow:hidden;
  background:var(--ds-surface);color:var(--ds-ink);
  font:600 var(--ds-text-body)/1 var(--ds-font);letter-spacing:-.01em;
  box-shadow:inset 0 0 0 0.5px var(--ds-line),0 1px 2px rgba(31,28,26,.05),0 8px 20px -12px rgba(31,28,26,.18);
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .42s cubic-bezier(.34,1.45,.64,1),box-shadow .3s ease,color .18s ease,background .35s cubic-bezier(.22,1,.36,1),filter .3s ease;
  user-select:none;-webkit-user-select:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
.ds-hold:hover{
  box-shadow:inset 0 0 0 0.5px color-mix(in srgb,var(--ds-accent) 28%,transparent),0 1px 2px rgba(31,28,26,.05),0 10px 24px -12px color-mix(in srgb,var(--ds-accent) 28%,transparent);
}
.ds-hold:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ds-focus),inset 0 0 0 0.5px var(--ds-line)}
.ds-hold-fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:linear-gradient(90deg,var(--ds-accent-hover) 0%,var(--ds-accent) 55%,var(--ds-accent-done) 100%);
  z-index:0;pointer-events:none;
  will-change:width;
}
.ds-hold-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
  background-size:220% 100%;
  opacity:0;transition:opacity .2s ease;
}
.ds-hold.is-holding .ds-hold-fill::after{
  opacity:1;animation:holdSheen 1.1s linear infinite;
}
@keyframes holdSheen{
  from{background-position:120% 0}
  to{background-position:-20% 0}
}
.ds-hold-label{
  position:relative;z-index:1;display:grid;place-items:center;
  min-height:1em;
}
.ds-hold-label > span{
  grid-area:1/1;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .28s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.34,1.45,.64,1),filter .28s ease;
}
.ds-hold .hold-idle{opacity:1;transform:translateY(0)}
.ds-hold .hold-done{
  opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;
}
.ds-hold .hold-check{
  display:inline-flex;font-size:16px;line-height:1;
  transform:scale(.5);opacity:0;
  transition:transform .45s cubic-bezier(.34,1.45,.64,1),opacity .25s ease;
}
.ds-hold.is-holding{
  color:#fff;
  transform:scale(.965);
  box-shadow:inset 0 0 0 0.5px rgba(46,107,92,.15),0 1px 2px rgba(31,28,26,.06),0 6px 16px -10px rgba(46,107,92,.4);
}
.ds-hold.is-holding .hold-idle{letter-spacing:.01em}
.ds-hold.is-canceling .ds-hold-fill{
  transition:width .55s cubic-bezier(.22,1,.36,1);
}
.ds-hold.is-done{
  background:var(--ds-accent);color:#fff;
  transform:scale(1.045);
  box-shadow:0 1px 2px rgba(31,28,26,.06),0 14px 32px -8px color-mix(in srgb,var(--ds-accent) 55%,transparent);
  filter:saturate(1.05);
}
.ds-hold.is-done .ds-hold-fill{width:100%;opacity:0;transition:opacity .2s ease}
.ds-hold.is-done .hold-idle{
  opacity:0;transform:translateY(-8px) scale(.98);filter:blur(.3px);
}
.ds-hold.is-done .hold-done{
  opacity:1;transform:translateY(0) scale(1);pointer-events:auto;
}
.ds-hold.is-done .hold-check{
  opacity:1;transform:scale(1);
}
.ds-hold.is-success-pop{transform:scale(1.07)}
.hold-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.hold-hint{
  font-size:12px;font-weight:500;color:var(--ds-muted);margin:0;
  transition:opacity .3s ease,transform .35s cubic-bezier(.22,1,.36,1),color .25s ease;
}
.hold-wrap.is-armed .hold-hint{color:var(--ds-accent)}
.hold-wrap.is-complete .hold-hint{
  opacity:0;transform:translateY(4px);
}
.tile-preview .ds-hold{transform:scale(.9);transform-origin:center;pointer-events:none;min-width:168px;height:44px;padding:0 26px}
.tile-preview .ds-hold.is-done,.tile-preview .ds-hold.is-holding,.tile-preview .ds-hold.is-success-pop{transform:scale(.9)}
.tile-preview .hold-hint{display:none}

/* Day 6: Like burst */
.ds-like{
  position:relative;border:0;cursor:pointer;width:52px;height:52px;border-radius:999px;
  background:var(--ds-surface);color:var(--ds-muted);
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 0.5px var(--ds-line),0 1px 2px rgba(31,28,26,.04);
  transition:transform .28s cubic-bezier(.34,1.45,.64,1),box-shadow .22s ease,color .2s ease,background .22s ease;
  -webkit-tap-highlight-color:transparent;
}
.ds-like .ti{font-size:22px;line-height:1;transition:transform .28s cubic-bezier(.34,1.45,.64,1)}
.ds-like:hover{color:var(--ds-accent);box-shadow:inset 0 0 0 0.5px rgba(46,107,92,.28),0 1px 2px rgba(31,28,26,.04)}
.ds-like:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ds-focus),inset 0 0 0 0.5px var(--ds-line)}
.ds-like:active{transform:scale(.94)}
.ds-like.is-liked{
  color:#fff;background:var(--ds-accent);
  box-shadow:0 1px 2px rgba(31,28,26,.06),0 8px 18px -4px rgba(46,107,92,.42);
  transform:scale(1.06);
}
.ds-like.is-liked .ti{transform:scale(1.08)}
.ds-like.is-pop{transform:scale(1.14)}
.ds-like-burst{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ds-like-dot{
  position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:var(--ds-accent);opacity:0;pointer-events:none;
}
.ds-like-dot.is-heart{width:10px;height:10px;margin:-5px 0 0 -5px;background:transparent;color:var(--ds-accent);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}
.ds-like-dot.is-heart::before{content:"\2665"}
.ds-like.is-liked .ds-like-dot{animation:like-fly .7s var(--ds-ease) forwards}
.like-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.like-hint{font-size:12px;color:var(--ds-muted);margin:0}
.tile-preview .ds-like{transform:scale(.88);transform-origin:center;pointer-events:none;width:44px;height:44px}
.tile-preview .ds-like .ti{font-size:18px}
@keyframes like-fly{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  18%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.7)}
}

/* Day 7: Morph checkbox */
.ds-check{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--ds-font);
  user-select:none;cursor:pointer;color:var(--ds-ink);
  position:relative;
}
.ds-check-input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.ds-check-box{
  position:relative;width:22px;height:22px;border-radius:var(--ds-radius-xs);flex-shrink:0;
  background:var(--ds-surface);
  box-shadow:inset 0 0 0 0.5px var(--ds-line),0 1px 2px rgba(31,28,26,.04);
  display:grid;place-items:center;
  transition:background .28s var(--ds-ease),box-shadow .28s var(--ds-ease),transform .36s cubic-bezier(.34,1.45,.64,1);
}
.ds-check.is-on .ds-check-box,.ds-check-input:checked + .ds-check-box{
  background:var(--ds-accent);
  box-shadow:0 1px 2px rgba(31,28,26,.06),0 8px 16px -4px rgba(46,107,92,.42);
  transform:scale(1.08);
}
.ds-check-mark{
  width:12px;height:12px;opacity:0;transform:scale(.35) rotate(-12deg);
  color:#fff;display:block;
  transition:opacity .2s ease,transform .4s cubic-bezier(.34,1.45,.64,1);
}
.ds-check.is-on .ds-check-mark,.ds-check-input:checked + .ds-check-box .ds-check-mark{
  opacity:1;transform:scale(1) rotate(0);
}
.ds-check-label{font-size:var(--ds-text-body);font-weight:500;color:var(--ds-ink)}
.ds-check-input:focus-visible + .ds-check-box{box-shadow:inset 0 0 0 0.5px var(--ds-line),0 0 0 3px var(--ds-focus)}
.check-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.tile-preview .ds-check{pointer-events:none;transform:scale(.92);transform-origin:center}

/* Day 8: Snap stepper */
.step-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.ds-step{
  display:inline-flex;align-items:center;gap:4px;padding:5px;
  border-radius:14px;background:var(--ds-surface);
  box-shadow:inset 0 0 0 0.5px var(--ds-line),0 1px 2px rgba(31,28,26,.04),0 8px 20px -14px rgba(31,28,26,.12);
  font-family:var(--ds-font);
  user-select:none;-webkit-user-select:none;
}
.ds-step-btn{
  width:40px;height:40px;border:0;border-radius:11px;cursor:pointer;
  background:transparent;color:var(--ds-muted);
  display:grid;place-items:center;padding:0;
  transition:background .22s ease,color .22s ease,transform .34s cubic-bezier(.34,1.45,.64,1),box-shadow .22s ease;
  -webkit-tap-highlight-color:transparent;
}
.ds-step-btn .ti{font-size:18px;line-height:1;transition:transform .34s cubic-bezier(.34,1.45,.64,1)}
.ds-step-btn:hover{background:rgba(0,0,0,.05);color:var(--ds-ink)}
.ds-step-btn:active,.ds-step-btn.is-press{
  transform:scale(.88);
  background:color-mix(in srgb,var(--ds-accent) 14%,transparent);
  color:var(--ds-accent);
}
.ds-step-btn.is-press .ti{transform:scale(.92)}
.ds-step-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ds-focus)}
.ds-step-btn:disabled{
  opacity:.32;cursor:default;transform:none;
  background:transparent;color:var(--ds-muted);
}
.ds-step-btn:disabled:hover{background:transparent;color:var(--ds-muted)}
.ds-step-val-wrap{
  position:relative;min-width:56px;height:40px;
  display:grid;place-items:center;overflow:hidden;
  border-radius:10px;
  background:color-mix(in srgb,var(--ds-ink) 3.5%,transparent);
}
.ds-step-slot{
  position:relative;display:grid;place-items:center;
  width:100%;height:100%;
}
.ds-step-out,.ds-step-in{
  grid-area:1/1;
  font:600 var(--ds-text-value)/1 var(--ds-font);
  color:var(--ds-ink);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
  transition:transform .4s cubic-bezier(.34,1.45,.64,1),opacity .28s ease;
  will-change:transform,opacity;
}
.ds-step-out{opacity:0;pointer-events:none}
.ds-step.is-anim-up .ds-step-out{
  opacity:0;transform:translateY(-14px) scale(.9);
}
.ds-step.is-anim-up .ds-step-in{
  animation:stepInUp .42s cubic-bezier(.34,1.45,.64,1) both;
}
.ds-step.is-anim-down .ds-step-out{
  opacity:0;transform:translateY(14px) scale(.9);
}
.ds-step.is-anim-down .ds-step-in{
  animation:stepInDown .42s cubic-bezier(.34,1.45,.64,1) both;
}
@keyframes stepInUp{
  from{transform:translateY(14px) scale(.9);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}
@keyframes stepInDown{
  from{transform:translateY(-14px) scale(.9);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}
.ds-step.is-hold .ds-step-val-wrap{
  background:color-mix(in srgb,var(--ds-accent) 10%,transparent);
}
.ds-step.is-hold .ds-step-in{color:var(--ds-accent)}
.tile-preview .ds-step{transform:scale(.9);transform-origin:center;pointer-events:none}
.tile-preview .ds-step-btn{width:34px;height:34px}
.tile-preview .ds-step-btn .ti{font-size:16px}
.tile-preview .ds-step-val-wrap{min-width:48px;height:34px}
.tile-preview .tile-preview .ds-step-out,.tile-preview .ds-step-in{font-size:16px}

@media (prefers-reduced-motion:reduce){
  .ds-soft-thumb,.ds-soft-track{transition:none!important}
  .ds-btn-primary.is-done{transform:none}
  .ds-seg-pill{transition:none!important}
  .ds-hold,.ds-hold .hold-idle,.ds-hold .hold-done,.ds-hold .hold-check,.ds-hold-fill{transition:none!important;animation:none!important}
  .ds-hold.is-holding,.ds-hold.is-done,.ds-hold.is-success-pop{transform:none!important}
  .ds-like,.ds-like .ti{transition:none!important}
  .ds-like.is-liked,.ds-like.is-pop{transform:none}
  .ds-like-dot{animation:none!important}
  .ds-check-box,.ds-check-mark{transition:none!important}
  .ds-check.is-on .ds-check-box,.ds-check-input:checked + .ds-check-box{transform:none}
  .ds-step-btn,.ds-step-out,.ds-step-in{transition:none!important;animation:none!important}
  .ds-step.is-anim-up .ds-step-in,.ds-step.is-anim-down .ds-step-in{animation:none!important;opacity:1;transform:none}
}

.ds-drop{

.ds-drop-card{
  position:relative;

    grid-template-columns:1fr!important;
    grid-auto-rows:minmax(52dvh,auto)!important;
  }
  .gallery[data-density="1"]{
    grid-template-columns:1fr!important;
    grid-auto-rows:minmax(100lvh,auto)!important;
  }
  .tile{min-height:0}
  .tile:last-of-type{min-height:100lvh}
  .detail{
    position:fixed;
    left:12px;right:12px;top:auto;
    bottom:12px;
    width:auto;
    height:calc(100svh - 24px);
    min-height:calc(100svh - 24px);
    max-height:calc(100svh - 24px);
    border-radius:20px;
    border:0.5px solid var(--line);
    box-shadow:0 28px 64px -28px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.16);
    transform:translateY(calc(100% + 36px));
    padding-bottom:0;
    background:var(--ds-surface);
    z-index:20;
  }
  .gallery.is-open .detail{transform:translateY(0)}
  .detail-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 10px 10px 16px;
    gap:8px;
    position:relative;
    background:var(--ds-surface);
  }
  .detail-head::before{
    content:"";
    position:absolute;
    top:8px;left:50%;
    width:36px;height:4px;border-radius:99px;
    background:color-mix(in srgb,var(--ds-ink) 12%,transparent);
    transform:translateX(-50%);
    pointer-events:none;
  }
  .detail-head-text{min-width:0;flex:1;display:flex;align-items:center}
  .detail-title{line-height:40px;font-size:17px}
  .detail-actions{
    width:auto;flex-wrap:nowrap;gap:0;
    justify-content:flex-end;
    align-items:center;
  }
  .copy-code,.ds-icon-btn{width:40px;height:40px}
  .close,.ds-icon-btn.close{width:40px;height:40px}
  .detail-body{
    padding:20px 16px 24px;
    margin:0 10px 10px;
    border-radius:14px;
    background:var(--ds-stage);
  }
  .chrome-fab{
    left:12px;right:auto;
    bottom:max(20px, env(safe-area-inset-bottom, 0px));
    overflow:visible;
    justify-content:flex-start;
    z-index:30;
    transition:opacity .28s ease,transform .34s cubic-bezier(.22,1,.36,1);
  }
  body.is-sheet .chrome-fab{
    opacity:0;pointer-events:none;transform:translateY(8px);
  }
  .accent-panel{
    left:0;right:auto;
    max-width:min(248px, calc(100vw - 24px));
  }
  .ds-seen{width:min(100%,340px)}
  .detail-scrim{
    position:fixed;inset:0;z-index:18;
    background:color-mix(in srgb,var(--ds-ink) 28%,transparent);
    opacity:0;pointer-events:none;
    transition:opacity .28s var(--ds-ease);
  }
  body.is-sheet .detail-scrim{display:block;opacity:1;pointer-events:auto}
}
.detail-scrim,.detail-scrim[hidden]{display:none}
/* Accent control */
.accent-chip{
  display:inline-flex;align-items:center;gap:10px;
  height:40px;padding:0 14px 0 10px;border-radius:999px;border:0;cursor:pointer;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 0 0 0.5px rgba(31,28,26,.10),0 10px 28px -12px rgba(0,0,0,.45);
  color:#1f1c1a;font:500 13px/1 var(--ds-font);
  transition:transform .42s cubic-bezier(.34,1.45,.64,1),box-shadow .3s ease,background .25s ease;
}
.accent-chip:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 0.5px rgba(31,28,26,.12),0 14px 32px -12px rgba(0,0,0,.5)}
.accent-chip:active{transform:scale(.97)}
.accent-chip:focus-visible{outline:2px solid var(--ds-accent);outline-offset:3px}
.accent-chip-dot{
  width:18px;height:18px;border-radius:50%;flex:0 0 auto;
  background:var(--ds-accent);
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.9);
  transition:background .35s cubic-bezier(.22,1,.36,1);
}
.accent-chip-label{letter-spacing:-.01em}
.accent-chip-caret{
  width:14px;height:14px;margin-left:2px;opacity:.45;
  transition:transform .42s cubic-bezier(.34,1.45,.64,1),opacity .2s ease;
}
.accent-chip.is-open{background:#fff;box-shadow:inset 0 0 0 0.5px var(--ds-line),0 6px 18px -10px rgba(0,0,0,.35)}
.accent-chip.is-open .accent-chip-caret{transform:rotate(180deg);opacity:.7}
.accent-panel{
  position:absolute;left:0;bottom:calc(100% + 10px);
  display:flex;flex-direction:column;gap:12px;
  width:248px;padding:12px 18px 12px 12px;
  border-radius:18px;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 0 0 0.5px var(--ds-line),0 18px 44px -16px rgba(0,0,0,.55);
  transform-origin:bottom left;
  opacity:0;transform:translateY(6px) scale(.94);
  pointer-events:none;visibility:hidden;
  transition:opacity .28s cubic-bezier(.22,1,.36,1),transform .4s cubic-bezier(.34,1.45,.64,1),visibility 0s linear .4s;
}
.accent-fab.is-open .accent-panel{
  opacity:1;transform:translateY(0) scale(1);
  pointer-events:auto;visibility:visible;
  transition:opacity .28s cubic-bezier(.22,1,.36,1),transform .4s cubic-bezier(.34,1.45,.64,1),visibility 0s;
}
.accent-panel-label{
  font:500 11px/1 var(--ds-font);color:var(--ds-muted);
  letter-spacing:.06em;text-transform:uppercase;padding:0 2px;
}
.accent-swatches{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding:3px 4px 3px 3px}
.accent-swatch{
  position:relative;
  width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;padding:0;flex:0 0 auto;
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.16);
  transition:transform .36s cubic-bezier(.34,1.45,.64,1),box-shadow .2s ease,background .25s ease;
}
.accent-swatch:hover{transform:scale(1.1)}
.accent-swatch.is-active{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ds-accent)}
.accent-swatch:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ds-focus)}
.accent-swatch .ti{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:14px;line-height:1;color:#fff;
  opacity:0;transform:scale(.6);
  transition:opacity .2s ease,transform .36s cubic-bezier(.34,1.45,.64,1);
  pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.25);
}
.accent-swatch.is-active .ti{opacity:1;transform:scale(1)}
.accent-swatch-tool{
  background:#f3f1ef;color:#1f1c1a;
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.1);
  display:grid;place-items:center;
  overflow:hidden;
}
.accent-swatch-tool .ti{
  position:static !important;inset:auto !important;
  opacity:.75 !important;transform:none !important;
  color:#1f1c1a !important;text-shadow:none !important;
  font-size:15px;line-height:1;
  transition:opacity .2s ease,color .2s ease,transform .36s cubic-bezier(.34,1.45,.64,1);
}
.accent-swatch-tool:hover .ti{opacity:1 !important}
.accent-swatch-tool.is-custom-color{
  /* filled with live accent; check shows like presets */
  background:var(--ds-accent);
  box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ds-accent);
}
.accent-swatch-tool.is-custom-color .ti{
  opacity:1 !important;color:#fff !important;transform:scale(1) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.25) !important;
}
.accent-swatch-tool.is-active:not(.is-custom-color){
  box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ds-accent);
}
.accent-swatch-tool.is-active:not(.is-custom-color) .ti{
  opacity:1 !important;color:var(--ds-accent) !important;
}
.accent-picker{
  display:none;flex-direction:column;gap:10px;
  padding-top:2px;
  border-top:0.5px solid rgba(0,0,0,.08);
  margin-top:2px;
}
.accent-fab.is-picking .accent-picker{display:flex !important}
.accent-picker[hidden]{display:none !important}
.accent-sv{
  position:relative;width:100%;aspect-ratio:1.35/1;border-radius:12px;overflow:hidden;
  cursor:crosshair;touch-action:none;
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.1);
  background:#f00;
}
.accent-sv-white{
  position:absolute;inset:0;
  background:linear-gradient(to right,#fff,transparent);
}
.accent-sv-black{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent,#000);
}
.accent-sv-thumb{
  position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.3);
  pointer-events:none;
}
.accent-hue{
  position:relative;height:14px;border-radius:999px;cursor:pointer;touch-action:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12);
}
.accent-hue-thumb{
  position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
  border-radius:50%;background:#fff;
  box-shadow:0 0 0 0.5px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.25);
  pointer-events:none;
}
.accent-hex-row{
  display:flex;align-items:center;gap:8px;
}
.accent-hex-preview{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--ds-accent);
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.16);
}
.accent-hex-input{
  flex:1;height:32px;border:0;border-radius:10px;padding:0 10px;
  font:500 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#1f1c1a;background:#f5f4f2;
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08);
  outline:none;letter-spacing:.02em;text-transform:uppercase;
}
.accent-hex-input:focus{box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08),0 0 0 3px var(--ds-focus)}

/* Day 13 Slide to unlock */
.ds-unlock{
  position:relative;width:min(280px,100%);
  display:flex;flex-direction:column;align-items:stretch;gap:14px;
  user-select:none;touch-action:none;
  font-family:var(--ds-font);
  --up:0;
}
.ds-unlock-track{
  position:relative;height:56px;border-radius:999px;
  background:rgba(0,0,0,.055);
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.06);
  overflow:hidden;
  transition:transform .42s cubic-bezier(.34,1.45,.64,1);
}
.ds-unlock.is-unlocked .ds-unlock-track{transform:scale(1.015)}
.ds-unlock-fill{
  position:absolute;inset:0 auto 0 0;width:0;
  background:color-mix(in srgb,var(--ds-accent) 16%,transparent);
  border-radius:999px;
  pointer-events:none;
  overflow:hidden;
  transition:background .22s ease;
}
.ds-unlock.is-armed .ds-unlock-fill{
  background:color-mix(in srgb,var(--ds-accent) 28%,transparent);
}
.ds-unlock.is-unlocked .ds-unlock-fill{
  width:100% !important;
  background:var(--ds-accent);
}
.ds-unlock-sheen{
  position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);
  transform:translateX(-120%);
  pointer-events:none;opacity:0;
}
.ds-unlock.is-unlocked .ds-unlock-sheen{
  opacity:1;
  animation:unlockSheen .75s cubic-bezier(.22,1,.36,1) both;
}
@keyframes unlockSheen{
  from{transform:translateX(-120%)}
  to{transform:translateX(120%)}
}
.ds-unlock-label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:6px;pointer-events:none;padding-left:36px;
  font:500 var(--ds-text-label)/1 var(--ds-font);color:var(--ds-muted);
  opacity:calc(1 - var(--up) * 1.35);
  transition:opacity .05s linear;
}
.ds-unlock.is-unlocked .ds-unlock-label{opacity:0}
.ds-unlock-label .ti{
  font-size:14px;opacity:.55;
  animation:unlockChevron 1.5s cubic-bezier(.22,1,.36,1) infinite;
}
@keyframes unlockChevron{
  0%,100%{transform:translateX(0);opacity:.4}
  50%{transform:translateX(4px);opacity:.85}
}
.ds-unlock.is-dragging .ds-unlock-label .ti{animation:none;opacity:.5}
.ds-unlock-thumb{
  position:absolute;top:4px;left:4px;width:48px;height:48px;border-radius:50%;border:0;outline:none;
  background:transparent;color:var(--ds-ink);cursor:grab;z-index:2;padding:0;
  display:grid;place-items:center;
  /* JS owns translateX on this node — never transition/animate transform here */
  -webkit-tap-highlight-color:transparent;
  will-change:transform;
}
.ds-unlock-knob{
  width:48px;height:48px;border-radius:50%;
  background:#fff;color:inherit;
  display:grid;place-items:center;
  box-shadow:
    inset 0 0 0 0.5px rgba(0,0,0,.08),
    0 1px 2px rgba(31,28,26,.08),
    0 8px 18px -8px rgba(31,28,26,.28);
  transition:transform .4s cubic-bezier(.34,1.45,.64,1),box-shadow .22s ease,background .25s ease,color .2s ease;
}
.ds-unlock-thumb:focus{outline:none}
.ds-unlock-thumb:focus-visible .ds-unlock-knob{
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--ds-ink) 20%,transparent),
    0 1px 2px rgba(31,28,26,.08),
    0 8px 18px -8px rgba(31,28,26,.28);
}
.ds-unlock-icons{
  position:relative;width:20px;height:20px;display:grid;place-items:center;
}
.ds-unlock-icons .ti{
  grid-area:1/1;font-size:20px;line-height:1;
  transition:opacity .28s ease,transform .42s cubic-bezier(.34,1.45,.64,1);
}
.ds-unlock-icons .ti-check{opacity:0;transform:scale(.5)}
.ds-unlock.is-dragging .ds-unlock-thumb{cursor:grabbing;color:var(--ds-accent)}
.ds-unlock.is-dragging .ds-unlock-knob{
  transform:scale(1.04);
  box-shadow:
    inset 0 0 0 0.5px rgba(0,0,0,.08),
    0 2px 4px rgba(31,28,26,.1),
    0 12px 24px -8px color-mix(in srgb,var(--ds-accent) 28%,transparent);
}
.ds-unlock.is-armed .ds-unlock-thumb{color:var(--ds-accent)}
.ds-unlock.is-armed .ds-unlock-knob{
  transform:scale(1.07);
  box-shadow:
    inset 0 0 0 0.5px rgba(0,0,0,.08),
    0 2px 4px rgba(31,28,26,.1),
    0 12px 26px -8px color-mix(in srgb,var(--ds-accent) 40%,transparent);
}
.ds-unlock.is-unlocked .ds-unlock-knob{
  background:transparent;box-shadow:none;transform:none;color:#fff;
}
.ds-unlock.is-unlocked .ds-unlock-icons .ti-lock{
  opacity:0;transform:scale(.5) rotate(-12deg);
}
.ds-unlock.is-unlocked .ds-unlock-icons .ti-check{
  opacity:1;transform:scale(1);
}
.ds-unlock.is-unlocked.is-success-pop .ds-unlock-icons .ti-check{
  animation:unlockCheckPop .48s cubic-bezier(.34,1.45,.64,1) both;
}
@keyframes unlockCheckPop{
  0%{transform:scale(.45)}
  60%{transform:scale(1.12)}
  100%{transform:scale(1)}
}
.tile-preview .ds-unlock{pointer-events:none;transform:scale(.85);transform-origin:center;width:240px}
.tile-preview .ds-unlock-track{height:48px}
.tile-preview .ds-unlock-thumb,.tile-preview .ds-unlock-knob{width:40px;height:40px}
.tile-preview .ds-unlock-thumb{top:4px;left:4px}
.tile-preview .ds-unlock-fill{width:0}
.tile-preview .ds-unlock-label{font-size:12px;padding-left:22px;opacity:1}
.tile-preview .ds-unlock-label .ti{animation:none}
@media (prefers-reduced-motion:reduce){
  .ds-unlock-label .ti,
  .ds-unlock.is-unlocked .ds-unlock-sheen,
  .ds-unlock.is-unlocked.is-success-pop .ds-unlock-icons .ti-check{animation:none!important}
  .ds-unlock-knob,.ds-unlock-icons .ti,.ds-unlock-status,.ds-unlock-track{transition:none!important}
}


/* Day 15 Weekly pulse */
.ds-pulse{
  display:flex;flex-direction:column;align-items:stretch;gap:16px;
  width:min(292px,100%);
  font-family:var(--ds-font);
  user-select:none;
}
.ds-pulse-top{
  display:flex;align-items:flex-end;justify-content:flex-end;gap:0;
}
.ds-pulse-kicker{
  display:flex;flex-direction:column;gap:6px;min-width:0;
}
.ds-pulse-label{
  font:500 var(--ds-text-micro)/1 var(--ds-font);color:var(--ds-muted);
  letter-spacing:.06em;text-transform:uppercase;
}
.ds-pulse-dayname{
  font:600 var(--ds-text-label)/1 var(--ds-font);color:var(--ds-ink);letter-spacing:-.01em;
  transition:color .22s ease;
}
.ds-pulse-readout{
  display:flex;align-items:baseline;gap:5px;
  flex-shrink:0;
}
.ds-pulse-value-wrap{
  position:relative;height:26px;min-width:2.4ch;
  overflow:hidden;display:grid;place-items:end;
}
.ds-pulse-out,.ds-pulse-value{
  grid-area:1/1;
  font:600 var(--ds-text-value)/1 var(--ds-font);font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;color:var(--ds-ink);text-align:right;
  will-change:transform,opacity;
}
.ds-pulse-out{opacity:0;pointer-events:none}
.ds-pulse.is-reel-up .ds-pulse-out{
  animation:pulseOutUp .36s cubic-bezier(.34,1.45,.64,1) both;
}
.ds-pulse.is-reel-up .ds-pulse-value{
  animation:pulseInUp .36s cubic-bezier(.34,1.45,.64,1) both;
}
.ds-pulse.is-reel-down .ds-pulse-out{
  animation:pulseOutDown .36s cubic-bezier(.34,1.45,.64,1) both;
}
.ds-pulse.is-reel-down .ds-pulse-value{
  animation:pulseInDown .36s cubic-bezier(.34,1.45,.64,1) both;
}
@keyframes pulseOutUp{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-110%);opacity:0}
}
@keyframes pulseInUp{
  from{transform:translateY(110%);opacity:0}
  to{transform:translateY(0);opacity:1}
}
@keyframes pulseOutDown{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(110%);opacity:0}
}
@keyframes pulseInDown{
  from{transform:translateY(-110%);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.ds-pulse-unit{
  font:500 var(--ds-text-meta)/1 var(--ds-font);color:var(--ds-muted);padding-bottom:2px;
}
.ds-pulse-well{
  position:relative;
  padding:14px 12px 10px;
  border-radius:16px;
  background:color-mix(in srgb,var(--ds-ink) 3.2%,transparent);
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.04);
}
.ds-pulse-chart{
  position:relative;z-index:1;
  display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
  height:128px;
}
.ds-pulse-baseline{
  position:absolute;left:12px;right:12px;bottom:28px;height:0.5px;
  background:rgba(0,0,0,.08);pointer-events:none;z-index:0;
}
.ds-pulse-col{
  flex:1;min-width:0;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;
  border:0;background:transparent;padding:0;cursor:pointer;
  font:inherit;color:inherit;
  -webkit-tap-highlight-color:transparent;
}
.ds-pulse-col:focus{outline:none}
.ds-pulse-col:focus-visible .ds-pulse-bar{
  outline:1.5px solid color-mix(in srgb,var(--ds-ink) 28%,transparent);
  outline-offset:2px;
}
.ds-pulse-bar-wrap{
  width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;
  min-height:0;
  transition:transform .4s cubic-bezier(.34,1.45,.64,1);
}
.ds-pulse-col.is-on .ds-pulse-bar-wrap{transform:translateY(-3px)}
.ds-pulse-bar{
  width:100%;max-width:26px;
  height:var(--h,40%);
  min-height:8px;
  border-radius:999px;
  background:rgba(0,0,0,.1);
  transform-origin:bottom center;
  transform:scaleY(0);
  transition:
    background .25s ease,
    transform .6s cubic-bezier(.34,1.45,.64,1),
    box-shadow .25s ease,
    filter .25s ease;
}
.ds-pulse.is-in .ds-pulse-bar{transform:scaleY(1)}
.ds-pulse.has-sel .ds-pulse-col:not(.is-on) .ds-pulse-bar{
  background:rgba(0,0,0,.07);
  filter:saturate(.85);
}
.ds-pulse-col.is-on .ds-pulse-bar{
  background:var(--ds-accent);
  box-shadow:0 12px 22px -12px color-mix(in srgb,var(--ds-accent) 55%,transparent);
  filter:none;
}
.ds-pulse.is-in .ds-pulse-col:nth-child(1) .ds-pulse-bar{transition-delay:.00s}
.ds-pulse.is-in .ds-pulse-col:nth-child(2) .ds-pulse-bar{transition-delay:.05s}
.ds-pulse.is-in .ds-pulse-col:nth-child(3) .ds-pulse-bar{transition-delay:.10s}
.ds-pulse.is-in .ds-pulse-col:nth-child(4) .ds-pulse-bar{transition-delay:.15s}
.ds-pulse.is-in .ds-pulse-col:nth-child(5) .ds-pulse-bar{transition-delay:.20s}
.ds-pulse.is-in .ds-pulse-col:nth-child(6) .ds-pulse-bar{transition-delay:.25s}
.ds-pulse.is-in .ds-pulse-col:nth-child(7) .ds-pulse-bar{transition-delay:.30s}
.ds-pulse-day{
  font:500 var(--ds-text-micro)/1 var(--ds-font);color:var(--ds-muted);
  font-variant-numeric:tabular-nums;
  transition:color .22s ease,transform .34s cubic-bezier(.34,1.45,.64,1);
}
.ds-pulse-col.is-on .ds-pulse-day{
  color:var(--ds-accent);font-weight:600;
  transform:translateY(-1px);
}
.tile-preview .ds-pulse{transform:scale(.86);transform-origin:center;pointer-events:none;width:min(230px,100%);gap:12px}
.tile-preview .ds-pulse-well{padding:10px 8px 8px;border-radius:14px}
.tile-preview .ds-pulse-chart{height:76px;gap:4px}
.tile-preview .ds-pulse-baseline{bottom:24px;left:8px;right:8px}
.tile-preview .ds-pulse-value,.tile-preview .ds-pulse-out{font-size:18px}
.tile-preview .ds-pulse-value-wrap{height:20px}
.tile-preview .ds-pulse-dayname{font-size:13px}
.tile-preview .ds-pulse-bar{max-width:16px;min-height:6px}
@media (prefers-reduced-motion:reduce){
  .ds-pulse-bar,.ds-pulse-bar-wrap,.ds-pulse-day,.ds-pulse-out,.ds-pulse-value{transition:none!important;animation:none!important}
  .ds-pulse-bar{transform:none!important}
  .ds-pulse.is-in .ds-pulse-bar{transform:none}
  .ds-pulse-col.is-on .ds-pulse-bar-wrap{transform:none}
}

/* Day 14 Copy link */
.ds-copy{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  width:min(280px,100%);
}
.ds-copy-btn{
  position:relative;border:0;cursor:pointer;
  height:48px;min-width:168px;padding:0 22px;border-radius:12px;
  background:var(--ds-surface);color:var(--ds-ink);
  font:600 var(--ds-text-body)/1 var(--ds-font);letter-spacing:-.01em;
  box-shadow:inset 0 0 0 0.5px var(--ds-line),0 1px 2px rgba(31,28,26,.04),0 8px 20px -12px rgba(31,28,26,.16);
  display:inline-flex;align-items:center;justify-content:center;
  overflow:hidden;
  transition:transform .42s cubic-bezier(.34,1.45,.64,1),background .28s ease,color .22s ease,box-shadow .3s ease;
  -webkit-tap-highlight-color:transparent;
}
.ds-copy-btn:hover{
  transform:translateY(-1px);
  box-shadow:inset 0 0 0 0.5px color-mix(in srgb,var(--ds-accent) 22%,transparent),0 10px 24px -12px color-mix(in srgb,var(--ds-accent) 32%,transparent);
}
.ds-copy-btn:active,.ds-copy-btn.is-press{transform:scale(.97)}
.ds-copy-btn:focus-visible{outline:2px solid var(--ds-accent);outline-offset:3px}
.ds-copy-btn.is-done{
  background:var(--ds-accent);color:#fff;
  transform:scale(1.04);
  box-shadow:0 12px 28px -8px color-mix(in srgb,var(--ds-accent) 50%,transparent);
}
.ds-copy-btn.is-pop{transform:scale(1.06)}
.ds-copy-label{position:relative;z-index:1;display:grid;place-items:center;min-height:1.2em}
.ds-copy-label>span{
  grid-area:1/1;display:inline-flex;align-items:center;gap:8px;
  transition:opacity .28s ease,transform .42s cubic-bezier(.34,1.45,.64,1);
}
.ds-copy-idle{opacity:1;transform:none}
.ds-copy-done{opacity:0;transform:translateY(8px) scale(.92);pointer-events:none}
.ds-copy-btn.is-done .ds-copy-idle{opacity:0;transform:translateY(-8px);pointer-events:none}
.ds-copy-btn.is-done .ds-copy-done{opacity:1;transform:none;pointer-events:auto}
.ds-copy-done .ti{
  font-size:16px;line-height:1;
  transform:scale(.5);opacity:0;
  transition:transform .45s cubic-bezier(.34,1.45,.64,1),opacity .25s ease;
}
.ds-copy-btn.is-done .ds-copy-done .ti{transform:scale(1);opacity:1}
.ds-copy-idle .ti{font-size:16px;line-height:1;opacity:.85}
.ds-copy-url{
  margin:0;max-width:100%;
  font:500 var(--ds-text-meta)/1.3 var(--ds-font-mono);color:var(--ds-muted);
  letter-spacing:-.01em;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .25s ease,transform .34s cubic-bezier(.34,1.45,.64,1);
}
.ds-copy.is-done .ds-copy-url{color:var(--ds-accent);transform:scale(1.02)}
.tile-preview .ds-copy{pointer-events:none;transform:scale(.9);transform-origin:center}
.tile-preview .ds-copy-url{display:none}
.tile-preview .ds-copy-btn{min-width:140px;height:44px}
@media (prefers-reduced-motion:reduce){
  .ds-copy-btn,.ds-copy-label>span,.ds-copy-done .ti,.ds-copy-url{transition:none!important}
  .ds-copy-btn.is-done,.ds-copy-btn.is-pop,.ds-copy-btn:hover{transform:none}
}


</style>
</head>
<body>
<div class="shell">
<div class="gallery" id="gallery" aria-label="UI gallery">
<section class="detail" id="detail">
<div class="detail-head">
<div class="detail-head-text">
<h2 class="detail-title" id="detailTitle">More details</h2>
</div>
<div class="detail-actions"><button class="ds-icon-btn copy-code hidden" type="button" id="shareLinkBtn" aria-label="Copy link" data-tip="Copy link"><i class="ti ti-link" aria-hidden="true"></i></button><button class="ds-icon-btn copy-code hidden" type="button" id="copyPromptBtn" aria-label="Copy prompt" data-tip="Copy prompt"><i class="ti ti-sparkles" aria-hidden="true"></i></button><button class="ds-icon-btn copy-code hidden" type="button" id="copyCodeBtn" aria-label="Copy code" data-tip="Copy code"><i class="ti ti-copy" aria-hidden="true"></i></button><button class="ds-icon-btn close" type="button" id="closeBtn" aria-label="Close"><i class="ti ti-x" style="font-size:18px;line-height:1"></i></button></div>
</div>
<div class="detail-body" id="detailBody"></div>
</section>
</div>
</div>
<div class="detail-scrim" id="detailScrim" hidden></div>
<div class="chrome-fab" id="chromeFab">
<button class="density-btn" type="button" id="densityBtn" data-density="4" aria-label="Density 4 across. Click to change.">
  <span class="density-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</button>
<div class="accent-fab" id="accentFab">
<button class="accent-chip" type="button" id="accentChip" aria-expanded="false" aria-controls="accentPanel" aria-label="Accent color">
  <span class="accent-chip-dot" id="accentChipDot" aria-hidden="true"></span>
  <span class="accent-chip-label">Accent</span>
  <i class="ti ti-chevron-down accent-chip-caret" aria-hidden="true"></i>
</button>
<div class="accent-panel" id="accentPanel" role="dialog" aria-label="Choose accent">
  <div class="accent-swatches" id="accentSwatches"></div>
  <div class="accent-picker" id="accentPicker" hidden>
    <div class="accent-sv" id="accentSv" role="slider" aria-label="Saturation and brightness">
      <div class="accent-sv-white" aria-hidden="true"></div>
      <div class="accent-sv-black" aria-hidden="true"></div>
      <div class="accent-sv-thumb" id="accentSvThumb" aria-hidden="true"></div>
    </div>
    <div class="accent-hue" id="accentHue" role="slider" aria-label="Hue">
      <div class="accent-hue-thumb" id="accentHueThumb" aria-hidden="true"></div>
    </div>
    <div class="accent-hex-row">
      <span class="accent-hex-preview" id="accentHexPreview" aria-hidden="true"></span>
      <input class="accent-hex-input" id="accentHex" type="text" maxlength="7" spellcheck="false" aria-label="Hex color" value="#2E6B5C" />
    </div>
  </div>
</div>
</div>
</div>
<div class="mail-fab" id="mailFab">
  <button class="mail-chip" type="button" id="mailChip" aria-expanded="false" aria-controls="mailPanel" aria-label="Get the weekly email">Email</button>
  <form class="mail-panel" id="mailPanel" autocomplete="on">
    <p class="mail-copy">One email on Friday. Ideas from the week, plus the install prompt.</p>
    <div class="mail-row">
      <input class="mail-input" id="mailEmail" type="email" name="email" required placeholder="you@studio.com" autocomplete="email" data-1p-ignore="true" data-lpignore="true" data-form-type="other" />
      <input type="text" name="company" tabindex="-1" autocomplete="off" class="mail-hp" aria-hidden="true" />
      <button class="mail-go" type="submit">Send it</button>
    </div>
    <p class="mail-note" id="mailNote" hidden></p>
  </form>
</div>

<script>

const pieces=[
{id:"day-20",day:"Day 20",title:"Gravity",desc:"Type. Letters fall. They pile up.",ready:true,code:"<!-- Gravity -->\n<div class=\"ds-grav\">\n  <div class=\"ds-grav-field\">\n    <input class=\"ds-grav-in\" type=\"text\" maxlength=\"28\" aria-label=\"Gravity\" />\n    <span class=\"ds-grav-caret\"></span>\n    <div class=\"ds-grav-bin\"></div>\n  </div>\n</div>\n<style>\n.ds-grav-field{position:relative;width:min(320px,100%);height:48px;border-radius:12px;background:#fff;border:0.5px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(31,28,26,.04);overflow:hidden}\n.ds-grav-field:focus-within{border-color:rgba(31,28,26,.16)}\n.ds-grav-ch{position:absolute;font:600 14px/1 Geist,system-ui,sans-serif;font-style:normal;height:1em;transform-origin:center}\n</style>",prompt:"Build a text input whose letters have gravity. Spec: Geist / var(--ds-font), 600 14px glyphs. White field matching the other inputs: 48px tall, 12px radius, width min(320px, 100%), 0.5px line border, soft field shadow. Letters collide with the inner edge of that border, not an inset well. No placeholder, no helper, no label. Hidden real input receives typing. Letters spawn at the caret, fall with gravity 2200 px/s2, bounce off the inner walls and floor (restitution 0.34), and stack on each other with cheap AABB. Backspace pops the newest letter up then fades it. Cap 28. Paste staggers new glyphs. Focus is a quieter ink hairline and a 1px lift, never an accent ring. Accent never on resting type. Blinking ink caret when focused. Reduced-motion settles letters on the floor. Springs use cubic-bezier(.34,1.45,.64,1). Copy has no em dashes. Acceptance: looks like a real input until you type; then letters physically pile inside the box."},
{id:"day-19",day:"Day 19",title:"Peel",desc:"Pull the corner. The paper folds. It snaps free.",ready:true,code:"<!-- Peel -->\n<div class=\"ds-peel\" style=\"--peel:36px\">\n  <div class=\"ds-peel-stage\">\n    <div class=\"ds-peel-base\"><i class=\"ti ti-check\"></i></div>\n    <span class=\"ds-peel-shade\"></span>\n    <div class=\"ds-peel-fly\">\n      <div class=\"ds-peel-sheet\"><span class=\"ds-peel-face\">YES</span></div>\n      <span class=\"ds-peel-flap\"><span class=\"ds-peel-flap-back\"></span></span>\n    </div>\n  </div>\n</div>\n<style>\n@property --peel{syntax:\"<length>\";inherits:true;initial-value:36px}\n.ds-peel{font-family:Geist,system-ui,sans-serif;width:168px;--peel:36px}\n.ds-peel-stage{position:relative;width:168px;height:168px}\n.ds-peel-base{position:absolute;inset:0;border-radius:22px;background:color-mix(in srgb,var(--ds-accent,#2e6b5c) 12%,#fff);display:grid;place-items:center;color:var(--ds-accent,#2e6b5c)}\n.ds-peel-shade{position:absolute;right:0;bottom:0;width:var(--peel);height:var(--peel);clip-path:polygon(100% 0,100% 100%,0 100%);border-radius:0 0 22px 0;background:linear-gradient(to bottom right,rgba(31,28,26,.3),rgba(31,28,26,.03))}\n.ds-peel-fly{position:absolute;inset:0}\n.ds-peel-sheet{position:absolute;inset:0;border-radius:22px;background:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--peel)),calc(100% - var(--peel)) 100%,0 100%)}\n.ds-peel-face{display:grid;place-items:center;height:100%;font:600 22px Geist,system-ui,sans-serif;letter-spacing:.02em}\n.ds-peel-flap{position:absolute;right:-1px;bottom:-1px;width:calc(var(--peel) + 1px);height:calc(var(--peel) + 1px);filter:drop-shadow(-4px -4px 5px rgba(31,28,26,.22))}\n.ds-peel-flap-back{display:block;width:100%;height:100%;clip-path:polygon(0 0,100% 0,0 100%);border-radius:22px 0 0 0;background:linear-gradient(135deg,#b7a78e 0%,#e8dcc6 44%,#fff8ee 50%,#d8c9b0 100%)}\n</style>",prompt:"Build a peel-the-corner YES sticker. Spec: Geist / var(--ds-font), var(--ds-accent) on the well and check only, 168px rounded square. Idle: white sticker with a 36px diagonal corner already lifted so the underside shows as a folded flap sitting on the remaining sheet (warm paper curl, darker at the tip, sharp crease specular at ~50%). Tile preview uses about 48px. Remaining sticker is everything above-left of the 45 degree crease from (W-t,H) to (W,H-t). The flap is a separate layer, triangle C'=(W-t,H-t), A=(W-t,H), B=(W,H-t), not a child of the clipped sheet, overlapping the crease by 1px with a 22px die-cut tip. A shade sibling (t by t at BR, clip-path polygon(100% 0, 100% 100%, 0 100%)) casts a gradient into the well. Underneath: accent-tinted well, tint only, no glue dots, check at rest. Drag only from the 80px bottom-right handle along the 45 degree axis toward the top left (dist = -(dx+dy)/sqrt(2)). Face is not a handle. Cursor grab on the handle only. --peel clamps to [36, 152]. Release early and --peel springs home with cubic-bezier(.34,1.45,.64,1). Past threshold 108: snap --peel to max in about 200ms, then the fly wrapper flies up-left, then 90ms later the check stamps on the exposed well. Do not reset clip-path. Hint stays peel the corner until done, then stuck. After done, tap the well to restick: sheet returns at max peel then springs to idle. Keyboard: Space, Enter, or ArrowLeft commits. Focus-visible on the 80px handle. Reduced-motion skips fly/snap and just reveals. Copy is utilitarian, no em dashes. Acceptance: the cut reads as a crease not a punched hole; you see the underside of the paper on the flap; commit feels torn free; cancel lays the paper back down."},
{id:"day-18",day:"Day 18",title:"Flick snooze",desc:"Flick the alarm. It flies. Five minutes reel in.",ready:true,code:"<!-- Flick snooze -->\n<div class=\"ds-snooze\">\n  <div class=\"ds-snooze-stage\">\n    <button class=\"ds-snooze-chip\" type=\"button\" aria-label=\"Flick to snooze\">\n      <span class=\"ds-snooze-bell\"><i class=\"ti ti-bell\"></i></span>\n      <span class=\"ds-snooze-time\"><span class=\"ds-snooze-in\">7:30</span></span>\n      <span class=\"ds-snooze-hint\">flick to snooze</span>\n    </button>\n  </div>\n</div>\n<style>\n.ds-snooze{font-family:Geist,system-ui,sans-serif;width:min(280px,100%)}\n.ds-snooze-chip{display:grid;grid-template-columns:36px 1fr;gap:2px 10px;width:min(220px,100%);min-height:64px;padding:12px 16px 12px 12px;border:0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(31,28,26,.08)}\n.ds-snooze-bell{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ds-accent,#2e6b5c) 14%,#fff);color:var(--ds-accent,#2e6b5c);grid-row:1 / span 2}\n.ds-snooze-time{font:600 22px Geist,system-ui,sans-serif;letter-spacing:-.03em}\n.ds-snooze-hint{font:500 12px Geist,system-ui,sans-serif;color:#6b6661}\n</style>",prompt:"Build a flick-to-snooze alarm chip. Spec: Geist, --ds-accent tokens, ~220px card. Idle: bell in an accent-tinted tile, tabular time 7:30, muted hint flick to snooze. Grab and drag down: chip follows with rubber resistance, bell tilts, hint quiets. Past ~56px it arms (accent wash). Release early and it springs home with cubic-bezier(.34,1.45,.64,1). Release armed: chip flies off with a slight spin, then a new chip pops in and the time reels +5 minutes (7:30 to 7:35). Keyboard: ArrowDown or Space commits a flick. Focus-visible quiet ring. Reduced-motion skips fly/reel/spring and just adds five minutes. Tile preview shows the resting 7:30 chip. Copy is utilitarian, no em dashes. Acceptance: cancel feels like a boomerang; commit feels thrown; time never jumps layout."},
{id:"day-17",day:"Day 17",title:"Fart react",desc:"Hold the bubble. It farts until you let go.",ready:true,code:"<!-- Fart react -->\n<div class=\"ds-seen\">\n  <button class=\"ds-seen-bubble\" type=\"button\">okay yeah I can do Saturday</button>\n  <audio src=\"/sounds/fart.mp3\" loop></audio>\n</div>\n<style>\n.ds-seen{font-family:Geist,system-ui,sans-serif;width:min(340px,100%)}\n.ds-seen-bubble{padding:12px 16px;border:0;border-radius:18px 18px 18px 6px;background:#fff;font:500 14px/1.35 Geist,system-ui,sans-serif}\n</style>",prompt:"Build a chat bubble that farts for as long as you hold it. Spec: Geist, --ds-accent. Incoming bubble: okay yeah I can do Saturday. Pointer down starts looping a fart MP3 immediately and squishes the bubble. Pointer up stops the sound and the bubble springs back. No reaction tray, no emoji, no delay. Keyboard: hold Space/Enter. Reduced-motion skips squash/puffs, still plays audio. Copy is utilitarian, no em dashes. Acceptance: sound starts on press, never on release; it does not stop until let go."},
{id:"day-16",day:"Day 16",title:"Drop zone",desc:"Drop or browse. Card compresses. Name reels in.",ready:true,code:"<!-- Drop zone -->\n<div class=\"ds-drop\">\n  <div class=\"ds-drop-well\" role=\"button\" tabindex=\"0\" aria-label=\"Drop a file or click to browse\">\n    <div class=\"ds-drop-idle\">\n      <span class=\"ds-drop-icon\"><i class=\"ti ti-upload\"></i></span>\n      <p class=\"ds-drop-title\">Drop a file</p>\n      <p class=\"ds-drop-hint\">or click to browse</p>\n    </div>\n    <div class=\"ds-drop-file\">\n      <span class=\"ds-drop-file-icon\"><i class=\"ti ti-file\"></i></span>\n      <div class=\"ds-drop-file-meta\">\n        <div class=\"ds-drop-file-name-wrap\"><span class=\"ds-drop-file-name\">brand-guide.pdf</span></div>\n        <p class=\"ds-drop-file-size\">1.2 MB</p>\n      </div>\n    </div>\n  </div>\n</div>\n<style>\n.ds-drop{font-family:Geist,system-ui,sans-serif;width:min(320px,100%)}\n.ds-drop-well{min-height:168px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.025);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.1);transition:transform .48s cubic-bezier(.34,1.45,.64,1),background .28s}\n.ds-drop.is-armed .ds-drop-well{background:color-mix(in srgb,var(--ds-accent,#2e6b5c) 10%,transparent);transform:scale(1.02)}\n.ds-drop.is-compress .ds-drop-well{transform:scale(.94,.88)}\n.ds-drop.is-filled .ds-drop-well{background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);transform:none;min-height:120px}\n.ds-drop-title{font:500 13px Geist,system-ui,sans-serif;color:#6b6661}\n.ds-drop-file-name{font:600 14px Geist,system-ui,sans-serif;color:#1f1c1a}\n.ds-drop-file-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ds-accent,#2e6b5c) 14%,#fff);color:var(--ds-accent,#2e6b5c)}\n</style>",prompt:"Build a file drop zone. Spec: Geist, --ds-accent tokens, ~320px wide well with soft inset and dashed inner border. Idle: upload icon in a small surface tile, muted label Drop a file, quieter hint or click to browse. Drag-over (armed): accent wash, solid accent edge, well scales to ~1.02, icon lifts with accent tint. On drop or file pick: brief spring compress (scale ~.94/.88) then settle; idle content exits up; file chip springs in with accent-tinted file icon, filename (digit/name reel if replacing), muted size meta, clear control. Click well opens file picker when empty. Clear resets. Keyboard: Enter/Space opens picker; focus-visible quiet ring. Reduced-motion skips compress/reel/spring. Acceptance: armed vs idle obvious; landing feels physical; no layout jump on clear; works with drag and click."},
{id:"day-15",day:"Day 15",title:"Weekly pulse",desc:"Bars spring in. Hover a day to read the pulse.",ready:true,code:"<!-- Weekly pulse -->\n<div class=\"ds-pulse is-in is-active has-sel\">\n  <div class=\"ds-pulse-top\">\n    <div class=\"ds-pulse-readout\"><span class=\"ds-pulse-value\">48</span></div>\n  </div>\n  <div class=\"ds-pulse-well\"><div class=\"ds-pulse-chart\">\n    <span class=\"ds-pulse-bar\" style=\"--h:46%;display:inline-block;width:26px;height:46%;border-radius:999px;background:rgba(0,0,0,.08)\"></span>\n  </div></div>\n</div>\n<style>\n.ds-pulse{font-family:Geist,system-ui,sans-serif;width:min(292px,100%)}\n.ds-pulse-value{font:600 26px Geist,system-ui,sans-serif;color:var(--ds-accent,#2e6b5c);font-variant-numeric:tabular-nums}\n.ds-pulse-bar{border-radius:999px;background:var(--ds-accent,#2e6b5c)}\n</style>",prompt:"Build a Weekly pulse chart. Spec: Geist, --ds-accent. Header: This week + selected day name + tabular visits readout with digit reel on change. Soft well behind seven pill bars (Mon-Sun). Bars spring from scaleY(0) with stagger (~50ms) using cubic-bezier(.34,1.45,.64,1). Hairline baseline. Selecting a day (hover/focus/click): accent fill, slight lift, day label accents, siblings quiet down, readout reels to that value. Default peak day. Quiet focus outline on bar. No hint. Acceptance: keyboard operable; reduced-motion skips stagger/reel."},
{id:"day-14",day:"Day 14",title:"Copy link",desc:"One click. Link copied. Check springs in.",ready:true,code:"<!-- Copy link -->\n<div class=\"ds-copy\">\n  <button class=\"ds-copy-btn\" type=\"button\">\n    <span class=\"ds-copy-label\">\n      <span class=\"ds-copy-idle\"><i class=\"ti ti-link\"></i><span>Copy link</span></span>\n      <span class=\"ds-copy-done\"><i class=\"ti ti-check\"></i><span>Copied</span></span>\n    </span>\n  </button>\n</div>\n<style>\n.ds-copy{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:Geist,system-ui,sans-serif}\n.ds-copy-btn{border:0;cursor:pointer;height:48px;min-width:168px;padding:0 22px;border-radius:12px;background:#fff;color:#1f1c1a;font:600 14px Geist,system-ui,sans-serif;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.06);display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:transform .42s cubic-bezier(.34,1.45,.64,1),background .28s,color .22s}\n.ds-copy-label{display:grid;place-items:center}\n.ds-copy-label>span{grid-area:1/1;display:inline-flex;align-items:center;gap:8px;transition:opacity .28s,transform .42s cubic-bezier(.34,1.45,.64,1)}\n.ds-copy-done{opacity:0;transform:translateY(8px)}\n.ds-copy-btn.is-done{background:var(--ds-accent,#2e6b5c);color:#fff;transform:scale(1.04)}\n.ds-copy-btn.is-done .ds-copy-idle{opacity:0;transform:translateY(-8px)}\n.ds-copy-btn.is-done .ds-copy-done{opacity:1;transform:none}\n.ds-copy-url{margin:0;font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b6661}\n</style>",prompt:"Build a Copy link button. Spec: Geist 600 14px, 48px tall, 12px radius, white surface idle with hairline border. Label stacks Copy link (link icon) and Copied (check) in one grid cell. On click: soft press, spring success to accent fill, idle exits up while Copied + check spring in, quiet mono URL under the button flashes accent. Reset after ~1.8s. Uses --ds-accent tokens. Acceptance: no layout jump; works if clipboard API fails (still shows Copied); reduced-motion skips spring; focus visible."},
{id:"day-13",day:"Day 13",title:"Slide to unlock",desc:"Slide to commit. Early release springs home.",ready:true,code:"<!-- Slide to unlock -->\n<div class=\"ds-unlock\">\n  <div class=\"ds-unlock-track\">\n    <div class=\"ds-unlock-fill\"></div>\n    <div class=\"ds-unlock-label\"><span>Slide to unlock</span><i class=\"ti ti-chevron-right\"></i></div>\n    <button class=\"ds-unlock-thumb\" type=\"button\" aria-label=\"Slide to unlock\"><i class=\"ti ti-lock\"></i></button>\n  </div>\n</div>\n<style>\n.ds-unlock{width:min(280px,100%);font-family:Geist,system-ui,sans-serif}\n.ds-unlock-track{position:relative;height:56px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden}\n.ds-unlock-fill{position:absolute;inset:0 auto 0 0;width:0;background:color-mix(in srgb,var(--ds-accent,#2e6b5c) 14%,transparent);border-radius:999px}\n.ds-unlock-thumb{position:absolute;top:4px;left:4px;width:48px;height:48px;border:0;border-radius:50%;background:#fff;cursor:grab;box-shadow:0 8px 18px -8px rgba(0,0,0,.28)}\n.ds-unlock.is-unlocked .ds-unlock-fill{width:100%;background:var(--ds-accent,#2e6b5c)}\n.ds-unlock.is-unlocked .ds-unlock-thumb{background:transparent;color:#fff;box-shadow:none}\n</style>",prompt:"Build a slide-to-unlock control. Spec: ~56px pill track, lock thumb on the left, center label Slide to unlock with a soft chevron pulse. Drag right; fill follows softly. Past ~85%: armed (Release to unlock) with status reel. Early release: spring snap-back home. Commit: track fills accent, stacked lock→check spring, status Unlocked, auto-reset ~2s. Quiet focus hairline (no sage glow ring). No instructional hint. Geist, --ds-accent, Tabler. Acceptance: continuous drag; cancel vs commit obvious; pointer capture; reduced-motion skips jelly/reel."},
{id:"day-12",day:"Day 12",title:"Tooltip",desc:"A tooltip. Then that tooltip's tooltip.",ready:true,code:"<!-- Tooltip -->\n<div class=\"ds-tip\" data-n=\"2\">\n  <span class=\"ds-tip-host\">this</span>\n  <button class=\"ds-tip-b\" type=\"button\" data-i=\"1\">Tooltip<i class=\"ds-tip-caret\"></i>\n    <span class=\"ds-tip-b\" data-i=\"2\">Tooltip<i class=\"ds-tip-caret\"></i></span>\n  </button>\n</div>\n<style>\n.ds-tip{font-family:Geist,system-ui,sans-serif;position:relative;width:280px;height:240px;overflow:visible}\n.ds-tip-host{position:absolute;left:50%;bottom:28px;color:#6b6661;font:500 13px/1.2 Geist,system-ui,sans-serif;letter-spacing:inherit;border-bottom:1px dotted currentColor}\n.ds-tip-b{background:#1f1c1a;color:#fff;padding:7px 10px;border-radius:6px;font:500 13px/1.2 Geist,system-ui,sans-serif;overflow:visible;box-shadow:0 8px 20px -10px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.12)}\n.ds-tip-b[data-i=\"1\"]{position:absolute;left:50%;bottom:52px;transform:translateX(-50%)}\n.ds-tip-b>.ds-tip-b{position:absolute;bottom:calc(100% + 6px);left:18px}\n.ds-tip-caret{position:absolute;bottom:-3.5px;left:50%;width:7px;height:7px;background:#1f1c1a;transform:rotate(45deg)}\n</style>",prompt:"Build a tooltip that has its own tooltip. Spec: Geist / var(--ds-font), 500 13px/1.2. Dark OS tooltip chrome (#1f1c1a, white type, 6px radius, 7px 10px padding, soft shadow, 7px rotated-square caret on the bottom edge). Nested DOM: each next tip lives inside the previous one. A dotted-underline host word this (muted ink, 13px, letter-spacing inherit, no helper copy) sits under the first caret so the root tip points at a word. No question mark, no instructional copy. Hover a visible tip (not the empty stage) to grow its tooltip. Hold or tap stacks more in a tight zigzag (6px gap, ~18px alternate offset), each caret aimed at its parent, up to 5. Every bubble says Tooltip. Release keeps the stack. Leave or tap empty stage collapses with a reverse stagger (~75ms). Keyboard Space/Enter holds. Reduced-motion skips stagger/overshoot. Accent only on the focus ring. Acceptance: the tooltip is the trigger; the root caret points at this; carets point at the parent; collapse is staggered not a snap; no helper copy."},
{id:"day-11",day:"Day 11",title:"OTP input",desc:"Four cells. Type, paste, or backspace through.",ready:true,code:"<!-- OTP input -->\n<div class=\"ds-otp\">\n  <div class=\"ds-otp-row\">\n    <input class=\"ds-otp-cell\" maxlength=\"1\" inputmode=\"numeric\" value=\"4\" />\n    <input class=\"ds-otp-cell\" maxlength=\"1\" inputmode=\"numeric\" value=\"8\" />\n    <input class=\"ds-otp-cell\" maxlength=\"1\" inputmode=\"numeric\" value=\"2\" />\n    <input class=\"ds-otp-cell\" maxlength=\"1\" inputmode=\"numeric\" />\n  </div>\n</div>\n<style>\n.ds-otp-row{display:flex;gap:10px}\n.ds-otp-cell{width:48px;height:56px;border:0;border-radius:12px;background:#fff;text-align:center;font:600 22px Geist,system-ui,sans-serif;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.06);outline:0;transition:transform .34s cubic-bezier(.34,1.45,.64,1),box-shadow .25s}\n.ds-otp-cell:focus{transform:scale(1.03);box-shadow:inset 0 0 0 1px rgba(31,28,26,.22),0 2px 10px -4px rgba(31,28,26,.16)}\n</style>",prompt:"Build a 4-digit OTP input. Spec: Geist Sans, accent via CSS variable --ds-accent (default #2e6b5c), 48x56 cells, 12px radius, hairline borders. Auto-advance on digit entry, Backspace moves to previous, paste of 4 digits fills all cells. Focused cell scales slightly with a quiet ink hairline (no glow). Filled cells stay white like empty; the digit is the signal. Acceptance: keyboard only works; paste works; no layout jump."},
{id:"day-10",day:"Day 10",title:"Clear input",desc:"Clear arrives softly. Clearing exhales the field.",ready:true,code:"<!-- Clear input -->\n<div class=\"ds-clear\">\n  <div class=\"ds-clear-field\">\n    <input class=\"ds-clear-input\" type=\"text\" placeholder=\"Email\" />\n    <button class=\"ds-clear-btn\" type=\"button\" aria-label=\"Clear\"><i class=\"ti ti-x\" aria-hidden=\"true\"></i></button>\n  </div>\n</div>\n<style>\n.ds-clear{position:relative;width:min(320px,100%)}\n.ds-clear-field{display:flex;align-items:center;height:48px;background:#fff;border:0.5px solid rgba(0,0,0,.06);border-radius:12px;box-shadow:0 1px 2px rgba(31,28,26,.04)}\n.ds-clear-input{flex:1;height:100%;border:0;background:0;padding:0 44px 0 16px;font:500 14px Geist,system-ui,sans-serif;outline:0}\n.ds-clear-input::placeholder{color:#b0aaa3;font-weight:400}\n.ds-clear-btn{position:absolute;right:6px;top:50%;width:32px;height:32px;border:0;border-radius:8px;background:0;color:#6b6661;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(-50%) scale(.85);transition:opacity .22s cubic-bezier(.22,1,.36,1),transform .28s cubic-bezier(.34,1.45,.64,1)}\n.ds-clear.has-value .ds-clear-btn{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}\n</style>",prompt:"Build a text input with a clear control. Spec: Geist Sans, sage accent #2e6b5c, hairline border rgba(0,0,0,.06), 48px field height, 12px radius. Clear (x) sits inside the field on the right. When empty, the clear control is invisible (opacity 0, scaled slightly down, no pointer events). When there is text, it fades and springs to full scale. Clicking clear empties the field and refocuses the input. Selected state is a quieter hairline and slight lift (no accent glow ring). Acceptance: no layout jump when the clear button appears; works with mouse and keyboard."},
{id:"day-09",day:"Day 9",title:"Snap slider",desc:"Drag free. Release and it springs to the tick.",ready:true,code:"<!-- Snap slider -->\n<div class=\"ds-slider\">\n  <div class=\"ds-slider-top\"><span class=\"ds-slider-label\">Intensity</span><span class=\"ds-slider-value\">50</span></div>\n  <div class=\"ds-slider-track\">\n    <div class=\"ds-slider-rail\"><div class=\"ds-slider-fill\" style=\"width:50%\"></div></div>\n    <div class=\"ds-slider-ticks\" aria-hidden=\"true\"><span class=\"ds-slider-tick\" style=\"left:0%\"></span><span class=\"ds-slider-tick\" style=\"left:25%\"></span><span class=\"ds-slider-tick is-active\" style=\"left:50%\"></span><span class=\"ds-slider-tick\" style=\"left:75%\"></span><span class=\"ds-slider-tick\" style=\"left:100%\"></span></div>\n    <div class=\"ds-slider-thumb\" style=\"left:50%\"></div>\n  </div>\n  <div class=\"ds-slider-marks\" aria-hidden=\"true\"><span class=\"ds-slider-mark\" style=\"left:0%\">0</span><span class=\"ds-slider-mark\" style=\"left:25%\">25</span><span class=\"ds-slider-mark is-active\" style=\"left:50%\">50</span><span class=\"ds-slider-mark\" style=\"left:75%\">75</span><span class=\"ds-slider-mark\" style=\"left:100%\">100</span></div>\n</div>\n<style>\n.ds-slider{display:flex;flex-direction:column;gap:14px;width:min(280px,100%);font-family:Geist,system-ui,sans-serif}\n.ds-slider-top{display:flex;justify-content:space-between;align-items:center}\n.ds-slider-label{font:500 13px Geist,system-ui,sans-serif;color:#6b6661}\n.ds-slider-value{font:600 22px/1 Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums}\n.ds-slider-track{position:relative;height:36px;display:flex;align-items:center;margin:0 11px}\n.ds-slider-rail{position:absolute;left:0;right:0;height:3px;border-radius:999px;background:rgba(0,0,0,.08)}\n.ds-slider-fill{height:100%;width:50%;border-radius:999px;background:var(--ds-accent,#2e6b5c);transition:width .55s cubic-bezier(.34,1.45,.64,1)}\n.ds-slider-ticks{position:absolute;left:0;right:0;top:50%;height:0}\n.ds-slider-tick{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:rgba(0,0,0,.14)}\n.ds-slider-tick.is-active{background:var(--ds-accent,#2e6b5c);transform:scale(1.35)}\n.ds-slider-thumb{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 4px 12px -3px color-mix(in srgb,var(--ds-accent,#2e6b5c) 38%,transparent);transition:left .55s cubic-bezier(.34,1.45,.64,1)}\n.ds-slider-marks{position:relative;height:14px;margin:0 11px}\n.ds-slider-mark{position:absolute;top:0;transform:translateX(-50%);font:500 11px Geist,system-ui,sans-serif;color:#a39e97;font-variant-numeric:tabular-nums}\n.ds-slider-mark.is-active{color:var(--ds-accent,#2e6b5c)}\n</style>",prompt:"Build a snap slider labeled Intensity from 0 to 100 in steps of 25. Spec: Geist, --ds-accent tokens (no hardcoded sage). Drag free along the track; fill and thumb follow live. Near ticks soft-highlight while dragging. On release, thumb/fill spring-settle to the nearest tick (cubic-bezier .34,1.45,.64,1) with a value digit reel and active tick pulse. White thumb with accent glow; rail thickens while dragging. Keyboard arrows/Home/End. Acceptance: free drag then soft snap; accent-aware; reduced-motion skips reel/spring."},
{id:"day-08",day:"Day 8",title:"Snap stepper",desc:"Digits reel. Hold accelerates. Ends soft-disable.",ready:true,code:"<!-- Snap stepper -->\n<div class=\"ds-step\" role=\"group\" aria-label=\"Quantity\">\n  <button class=\"ds-step-btn\" type=\"button\" aria-label=\"Decrease\"><i class=\"ti ti-minus\"></i></button>\n  <div class=\"ds-step-val-wrap\"><div class=\"ds-step-slot\"><span class=\"ds-step-in\">3</span></div></div>\n  <button class=\"ds-step-btn\" type=\"button\" aria-label=\"Increase\"><i class=\"ti ti-plus\"></i></button>\n</div>\n<style>\n.ds-step{display:inline-flex;align-items:center;gap:4px;padding:5px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.06);font-family:Geist,system-ui,sans-serif}\n.ds-step-btn{width:40px;height:40px;border:0;border-radius:11px;background:0;color:#6b6661;display:grid;place-items:center;transition:transform .34s cubic-bezier(.34,1.45,.64,1),background .22s,color .22s}\n.ds-step-btn:active{transform:scale(.88);background:color-mix(in srgb,var(--ds-accent,#2e6b5c) 14%,transparent);color:var(--ds-accent,#2e6b5c)}\n.ds-step-val-wrap{min-width:56px;height:40px;display:grid;place-items:center;overflow:hidden;border-radius:10px;background:rgba(0,0,0,.035)}\n.ds-step-slot{display:grid;place-items:center}\n.ds-step-in{grid-area:1/1;font:600 17px/1 Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums}\n</style>",prompt:"Build a quantity snap stepper. Spec: pill shell with minus, tabular value well, plus (Tabler icons). Geist, --ds-accent. Value changes use a dual-layer digit reel: outgoing digit exits, incoming springs in (cubic-bezier .34,1.45,.64,1), direction matches +/-. Buttons spring-press with accent wash. Hold-to-accelerate after ~360ms, speeding to ~42ms. Min 0 / max 12 disable ends. Keyboard arrows on the group. Acceptance: no layout jump as digits change; hold clear on release; reduced-motion skips reel."},
{id:"day-07",day:"Day 7",title:"Morph checkbox",desc:"Custom check with a springy pop when it draws in.",ready:true,code:"<!-- Morph checkbox -->\n<label class=\"ds-check\">\n  <input class=\"ds-check-input\" type=\"checkbox\" />\n  <span class=\"ds-check-box\" aria-hidden=\"true\">\n    <svg class=\"ds-check-mark\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.5 6.2L5 8.7L9.5 3.5\"/></svg>\n  </span>\n  <span class=\"ds-check-label\">Remember me</span>\n</label>\n<style>\n.ds-check{display:inline-flex;align-items:center;gap:12px;font:500 14px Geist,system-ui,sans-serif;color:#1f1c1a;cursor:pointer;user-select:none;position:relative}\n.ds-check-input{position:absolute;opacity:0;width:0;height:0}\n.ds-check-box{width:22px;height:22px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);display:grid;place-items:center;transition:background .28s cubic-bezier(.22,1,.36,1),transform .36s cubic-bezier(.34,1.45,.64,1)}\n.ds-check-input:checked + .ds-check-box{background:#2e6b5c;box-shadow:0 8px 16px -4px rgba(46,107,92,.42);transform:scale(1.08)}\n.ds-check-mark{width:12px;height:12px;opacity:0;transform:scale(.35) rotate(-12deg);color:#fff;transition:opacity .2s,transform .4s cubic-bezier(.34,1.45,.64,1)}\n.ds-check-input:checked + .ds-check-box .ds-check-mark{opacity:1;transform:scale(1) rotate(0)}\n</style>",prompt:"Build a custom checkbox labeled Remember me. Spec: Geist Sans, sage #2e6b5c fill when on, 7px radius box. Check mark springs in with a slight overshoot (cubic-bezier .34,1.45,.64,1). Unchecked is white with hairline border. Acceptance: keyboard toggle works; focus visible; motion respects reduced-motion."},
{id:"day-06",day:"Day 6",title:"Like burst",desc:"Heart pops with a tiny particle burst on like.",ready:true,code:"<!-- Like burst -->\n<button class=\"ds-like\" type=\"button\" aria-pressed=\"false\" aria-label=\"Like\">\n  <i class=\"ti ti-heart\" aria-hidden=\"true\"></i>\n  <span class=\"ds-like-burst\" aria-hidden=\"true\"></span>\n</button>\n<style>\n.ds-like{position:relative;border:0;cursor:pointer;width:52px;height:52px;border-radius:999px;background:#fff;color:#6b6661;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08);transition:transform .28s cubic-bezier(.34,1.45,.64,1),color .2s,background .22s}\n.ds-like .ti{font-size:22px;line-height:1}\n.ds-like.is-liked{color:#fff;background:#2e6b5c;transform:scale(1.06);box-shadow:0 8px 18px -4px rgba(46,107,92,.42)}\n.ds-like-burst{position:absolute;inset:0;pointer-events:none}\n</style>",prompt:"Build a round like button with a heart icon. Spec: 52px circle, Geist/Tabler heart, sage #2e6b5c when liked. On like: spring scale and a tiny burst of small particles. Unlike clears softly. Acceptance: aria-pressed updates; particles do not affect layout."},
{id:"day-05",day:"Day 5",title:"Hold to confirm",desc:"Hold builds pressure. Release cancels. Success lands.",ready:true,code:"<!-- Hold to confirm -->\n<button class=\"ds-hold\" type=\"button\">\n  <span class=\"ds-hold-fill\"></span>\n  <span class=\"ds-hold-label\">\n    <span class=\"hold-idle\">Hold to confirm</span>\n    <span class=\"hold-done\"><i class=\"ti ti-check hold-check\"></i><span>Confirmed</span></span>\n  </span>\n</button>\n<style>\n.ds-hold{position:relative;border:0;cursor:pointer;height:48px;min-width:196px;padding:0 32px;border-radius:999px;overflow:hidden;background:#fff;color:#1f1c1a;font:600 14px Geist,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08),0 8px 20px -12px rgba(31,28,26,.18);transition:transform .42s cubic-bezier(.34,1.45,.64,1),box-shadow .3s,background .35s}\n.ds-hold-fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--ds-accent-hover,#275e51),var(--ds-accent,#2e6b5c),var(--ds-accent-done,#3a7d6c))}\n.ds-hold-label{position:relative;z-index:1;display:grid;place-items:center}\n.ds-hold-label>span{grid-area:1/1;display:inline-flex;align-items:center;gap:8px;transition:opacity .28s,transform .42s cubic-bezier(.34,1.45,.64,1)}\n.hold-done{opacity:0;transform:translateY(6px)}\n.ds-hold.is-holding{color:#fff;transform:scale(.965)}\n.ds-hold.is-done{background:#2e6b5c;color:#fff;transform:scale(1.045);box-shadow:0 14px 32px -8px rgba(46,107,92,.55)}\n.ds-hold.is-done .hold-idle{opacity:0;transform:translateY(-8px)}\n.ds-hold.is-done .hold-done{opacity:1;transform:none}\n.ds-hold.is-done .hold-check{transform:scale(1)}\n.hold-check{transform:scale(.5);opacity:0;transition:transform .45s cubic-bezier(.34,1.45,.64,1),opacity .25s}\n.ds-hold.is-done .hold-check{opacity:1}\n</style>",prompt:"Build an undeniable hold-to-confirm button. Pill shape (48px tall, full radius). Idle: white surface, hairline border, soft shadow, label Hold to confirm centered. On press: scale to ~0.965, sage gradient fill grows from the left with an ease-out curve (~920ms) and a subtle sheen. Label turns white as fill covers. Releasing early eases the fill back out (not a hard reset). On success: button becomes solid sage, scales up with spring overshoot, idle label exits upward while Confirmed + check crossfade/spring in (stacked in one grid cell so layout never shifts), tasteful confetti burst. Then reset after ~1.9s. Geist Sans 600 14px, accent #2e6b5c. Keyboard: Space/Enter press-and-hold. Reduced motion: complete immediately, no sheen/confetti. Acceptance: cancel feels soft; success feels earned; label never jumps."},
{id:"day-04",day:"Day 4",title:"Segmented control",desc:"Pill indicator eases between Day, Week, and Month.",ready:true,code:"<!-- Segmented control -->\n<div class=\"ds-seg\" role=\"tablist\">\n  <span class=\"ds-seg-pill\"></span>\n  <button class=\"ds-seg-btn is-active\" type=\"button\">Day</button>\n  <button class=\"ds-seg-btn\" type=\"button\">Week</button>\n  <button class=\"ds-seg-btn\" type=\"button\">Month</button>\n</div>\n<style>\n.ds-seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:12px;background:rgba(0,0,0,.06)}\n.ds-seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(33.333% - 2.67px);border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);pointer-events:none}\n.ds-seg-btn{position:relative;z-index:1;border:0;background:0;cursor:pointer;height:32px;padding:0 16px;min-width:72px;font:500 13px Geist,system-ui,sans-serif;color:#6b6661;border-radius:9px}\n.ds-seg-btn.is-active{color:#1f1c1a}\n</style>",prompt:"Build a segmented control with Day, Week, Month. Spec: Geist 13px medium, sage inactive track, white pill that eases between segments (~380ms). Active label is ink, inactive muted. Acceptance: pill width matches segment; keyboard selectable."},
{id:"day-03",day:"Day 3",title:"Soft toggle",desc:"Lagged ease on, no hard snap.",ready:true,code:"<!-- Soft toggle -->\n<label class=\"ds-soft\">\n  <input class=\"ds-soft-input\" type=\"checkbox\" />\n  <span class=\"ds-soft-track\"><span class=\"ds-soft-thumb\"></span></span>\n  <span class=\"ds-soft-label\">Notifications</span>\n</label>\n<style>\n.ds-soft{display:inline-flex;align-items:center;gap:12px;font:500 14px Geist,system-ui,sans-serif;color:#1f1c1a;cursor:pointer;user-select:none}\n.ds-soft-input{position:absolute;opacity:0;width:0;height:0}\n.ds-soft-track{position:relative;width:48px;height:28px;border-radius:999px;background:rgba(0,0,0,.12);transition:background .5s cubic-bezier(.22,1,.36,1)}\n.ds-soft-input:checked + .ds-soft-track{background:#2e6b5c}\n.ds-soft-thumb{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .58s cubic-bezier(.34,1.45,.64,1)}\n.ds-soft-input:checked + .ds-soft-track .ds-soft-thumb{transform:translateX(20px)}\n</style>",prompt:"Build a soft Notifications toggle. Spec: 48x28 track, white thumb, sage when on. Thumb eases with spring overshoot (.58s cubic-bezier .34,1.45,.64,1), never a hard snap. Focus glow on the track. Acceptance: keyboard operable; reduced-motion removes spring."},
