function resetCopyBtn(btn, label){
  btn.classList.remove("is-copied");
  if(label){
    btn.setAttribute("data-tip", label);
    btn.setAttribute("aria-label", label);
  }
  const ic=btn.querySelector(".ti");
  if(ic){
    if(btn===copyPromptBtn) ic.className="ti ti-sparkles";
    else if(btn===shareLinkBtn) ic.className="ti ti-link";
    else ic.className="ti ti-copy";
  }
}
function flashCopied(btn, label){
  if(window.vrSound) vrSound.tick(1.28);
  btn.classList.add("is-copied");
  btn.setAttribute("data-tip", "Copied");
  btn.setAttribute("aria-label", "Copied");
  const ic=btn.querySelector(".ti");
  if(ic) ic.className="ti ti-check";
  clearTimeout(copyResetTimer);
  copyResetTimer=setTimeout(()=>resetCopyBtn(btn,label),1600);
}
async function copyText(text, btn, label){
  if(!text)return;
  try{ await navigator.clipboard.writeText(text); }
  catch(err){
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")}catch(e){}
    ta.remove();
  }
  flashCopied(btn,label);
}

let shareAccent="2e6b5c";
let pendingDay=null;
try{
  const boot=new URL(location.href);
  const bootM=boot.pathname.match(/^\/day\/(\d+)\/?$/);
  if(bootM) pendingDay=parseInt(bootM[1],10);
  else {
    const q=parseInt(boot.searchParams.get("day")||"",10);
    if(q) pendingDay=q;
  }
}catch(e){}
function piecePath(day){
  return "/day/"+String(day);
}
function parsePieceFromUrl(){
  const u=new URL(location.href);
  const m=u.pathname.match(/^\/day\/(\d+)\/?$/);
  if(m) return parseInt(m[1],10);
  const q=parseInt(u.searchParams.get("day")||"",10);
  if(q) return q;
  return pendingDay||null;
}
function syncShareUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.delete("day");
    if(!shareDay){
      if(pendingDay) return;
      u.pathname="/";
      u.searchParams.delete("accent");
      u.searchParams.delete("density");
      const next=u.pathname + (u.search?u.search:"") + u.hash;
      if(location.pathname+location.search+location.hash !== next) history.replaceState(null, "", next);
      return;
    }
    u.pathname=piecePath(shareDay);
    u.searchParams.set("accent", (shareAccent||"2e6b5c").replace("#","").toLowerCase());
    u.searchParams.set("density", String(galleryCols||4));
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }catch(e){}
}

function layoutSegPills(scope){
  (scope||document).querySelectorAll(".ds-seg").forEach(wrap=>{
    const pill=wrap.querySelector(".ds-seg-pill");
    const active=wrap.querySelector(".ds-seg-btn.is-active")||wrap.querySelector(".ds-seg-btn");
    if(!pill||!active)return;
    const wr=wrap.getBoundingClientRect();
    const br=active.getBoundingClientRect();
    if(!br.width)return;
    pill.style.width=br.width+"px";
    pill.style.transform="translateX("+(br.left-wr.left-4)+"px)";
  });
}
requestAnimationFrame(()=>layoutSegPills(gallery));
function layoutSliderFills(scope){
  (scope||document).querySelectorAll(".ds-slider").forEach(wrap=>{
    const track=wrap.querySelector(".ds-slider-track");
    const fill=wrap.querySelector(".ds-slider-fill");
    const thumb=wrap.querySelector(".ds-slider-thumb");
    if(!track||!fill||!thumb)return;
    const left=parseFloat(thumb.style.left);
    if(Number.isNaN(left))return;
    const trackW=track.clientWidth||1;
    fill.style.width=Math.max(0,(left/100)*trackW-15)+"px";
  });
}
requestAnimationFrame(()=>layoutSliderFills(gallery));

(function initSheetDrag(){
  const sheet=document.getElementById("detail");
  const head=sheet && sheet.querySelector(".detail-head");
  if(!sheet||!head) return;
  const mq=window.matchMedia("(max-width:800px)");
  let startY=0, dy=0, dragging=false, pid=null;
  function mobile(){ return mq.matches && gallery.classList.contains("is-open"); }
  function reset(){
    dragging=false; pid=null; dy=0;
    sheet.style.transition="";
    sheet.style.transform="";
  }
  head.addEventListener("pointerdown",function(e){
    if(!mobile()) return;
    if(e.target.closest("button")) return;
    dragging=true; pid=e.pointerId; startY=e.clientY; dy=0;
    sheet.style.transition="none";
    try{ head.setPointerCapture(e.pointerId); }catch(err){}
  });
  head.addEventListener("pointermove",function(e){
    if(!dragging || e.pointerId!==pid) return;
    dy=Math.max(0, e.clientY-startY);
    sheet.style.transform="translateY("+dy+"px)";
  });
  function end(e){
    if(!dragging || (e && e.pointerId!==pid)) return;
    const should=dy>96 || (e && e.velocityY && e.velocityY>0.6);
    const dist=dy;
    dragging=false; pid=null;
    if(should){
      sheet.style.transition="transform .28s cubic-bezier(.22,1,.36,1)";
      sheet.style.transform="translateY(110%)";
      setTimeout(function(){ reset(); closeDetail(); }, 260);
    }else{
      sheet.style.transition="transform .32s cubic-bezier(.22,1,.36,1)";
      sheet.style.transform="translateY(0)";
      setTimeout(function(){ if(!dragging){ sheet.style.transition=""; sheet.style.transform=""; } }, 320);
    }
    dy=0;
  }
  head.addEventListener("pointerup", end);
  head.addEventListener("pointercancel", end);
})();

    syncFill(cell);

    const next=Math.max(1, Math.min(5, v));

    wrap.dataset.n=String(n);

    if(n===5 && grew) wrap.classList.add("is-max");
    if(n<5) wrap.classList.remove("is-max");
    if(sound && grew && window.vrSound) vrSound.tick(0.84 + n*0.12);
  }

    clearTimeout(collapseTimer);
    collapseTimer=0;
  }

    cancelCollapse();

      if(n<=1){

      }

  }
  function restick(){
    if(!wrap.classList.contains("is-done")) return;
    wrap.classList.remove("is-done","is-fly","is-snap");
    handle.tabIndex=0;
    if(hint) hint.textContent="peel the corner";
    x=MAX; v=0; target=MAX; curl=0; apply();

      if(c.length){ cx=c[c.length-1].clientX; cy=c[c.length-1].clientY; }

    if(!dragging) return;

    if(wrap.classList.contains("is-fly")||wrap.classList.contains("is-done")||mode==="rip") return;

    }
  });

    if(!wrap.classList.contains("is-done")) return;

  });
}

function wireSnooze(root){
  const wrap=root.querySelector(".ds-snooze");
  const chip=wrap.querySelector(".ds-snooze-chip");
  const timeIn=wrap.querySelector(".ds-snooze-in");
  const timeOut=wrap.querySelector(".ds-snooze-out");
  const THRESH=56;
  let h=7, m=30;
  let dragging=false, startY=0, dy=0, pid=null;
  let reelTimer=0, flyTimer=0;
  function fmt(hh,mm){ return hh+":"+String(mm).padStart(2,"0"); }
  function addFive(){
    m+=5;
    if(m>=60){ m-=60; h=(h%12)+1; }
  }
  function reelTo(next){
    const prev=timeIn.textContent||"";
    if(reduceMotion || prev===next){
      timeIn.textContent=next;
      timeOut.textContent="";
      wrap.classList.remove("is-reel");
      return;
    }
    clearTimeout(reelTimer);
    wrap.classList.remove("is-reel");
    timeOut.textContent=prev;
    timeIn.textContent=next;
    void wrap.offsetWidth;
    wrap.classList.add("is-reel");
    reelTimer=setTimeout(()=>wrap.classList.remove("is-reel"), 460);
  }
  function rubber(y){
    if(y<=THRESH) return y;
    return THRESH + (y-THRESH)*0.38;
  }
  function resetClasses(){
    wrap.classList.remove("is-drag","is-armed","is-fly","is-home");
    chip.style.transform="";
    chip.style.opacity="";
  }
  function home(){
    wrap.classList.remove("is-drag","is-armed","is-fly");
    wrap.classList.add("is-home");
    chip.style.transform="translateY(0) rotate(0deg)";
    const done=()=>{ wrap.classList.remove("is-home"); chip.style.transform=""; chip.removeEventListener("transitionend", done); };
    chip.addEventListener("transitionend", done);
    setTimeout(done, 560);
  }
  function commit(){
    wrap.classList.remove("is-drag","is-armed","is-home");
    wrap.classList.add("is-fly");
    chip.style.transform="translateY(140px) rotate(12deg)";
    chip.style.opacity="0";
    clearTimeout(flyTimer);
    flyTimer=setTimeout(()=>{
      addFive();
      resetClasses();
      wrap.classList.add("is-pop");
      reelTo(fmt(h,m));
      setTimeout(()=>wrap.classList.remove("is-pop"), 520);
    }, reduceMotion?0:280);
  }
  function onDown(e){
    if(wrap.classList.contains("is-fly")) return;
    dragging=true;
    startY=e.clientY;
    dy=0;
    pid=e.pointerId;
    if(chip.setPointerCapture) try{ chip.setPointerCapture(pid); }catch(err){}
    wrap.classList.add("is-drag");
    wrap.classList.remove("is-home","is-pop","is-fly");
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    dy=Math.max(0, e.clientY-startY);
    const y=rubber(dy);
    const rot=Math.min(10, y*0.08);
    chip.style.transform="translateY("+y+"px) rotate("+rot+"deg)";
    wrap.classList.toggle("is-armed", dy>=THRESH);
  }
  function onUp(){
    if(!dragging) return;
    dragging=false;
    const go=dy>=THRESH;
    dy=0;
    if(go) commit();
    else home();
  }
  chip.addEventListener("pointerdown", onDown);
  chip.addEventListener("pointermove", onMove);
  chip.addEventListener("pointerup", onUp);
  chip.addEventListener("pointercancel", onUp);
  chip.addEventListener("keydown", e=>{
    if(e.key==="ArrowDown"||e.key===" "||e.key==="Enter"){
      e.preventDefault();
      dy=THRESH+8;
      commit();
    }
  });
}

function wireSeen(root){
  const wrap=root.querySelector(".ds-seen");
  const bubble=wrap.querySelector(".ds-seen-bubble");
  const audio=wrap.querySelector(".ds-seen-audio");
  let holding=false, fadeRaf=0;
  function setVol(v){ try{ audio.volume=Math.max(0,Math.min(1,v)); }catch(e){} }
  function cancelFade(){ if(fadeRaf) cancelAnimationFrame(fadeRaf); fadeRaf=0; }
  function start(){
    cancelFade();
    holding=true;
    wrap.classList.add("is-hold");
    try{
      audio.loop=true;
      setVol(1);
      if(audio.paused){ audio.currentTime=0; }
      const p=audio.play();
      if(p&&p.catch) p.catch(()=>{});
    }catch(e){}
  }
  function stop(){
    if(!holding) return;
    holding=false;
    wrap.classList.remove("is-hold");
    cancelFade();
    const from=audio.volume||1;
    const dur=reduceMotion?80:520;
    const t0=performance.now();
    function tick(now){
      const t=Math.min(1,(now-t0)/dur);
      const k=1-Math.pow(1-t,2);
      setVol(from*(1-k));
      if(t<1){ fadeRaf=requestAnimationFrame(tick); return; }
      fadeRaf=0;
      try{ audio.pause(); audio.currentTime=0; }catch(e){}
      setVol(1);
    }
    fadeRaf=requestAnimationFrame(tick);
  }
  bubble.addEventListener("pointerdown", e=>{
    e.preventDefault();
    e.stopPropagation();
    if(e.pointerId!=null && bubble.setPointerCapture) try{ bubble.setPointerCapture(e.pointerId); }catch(err){}
    start();
  });
  bubble.addEventListener("pointerup", e=>{ e.preventDefault(); stop(); });
  bubble.addEventListener("pointercancel", stop);
  bubble.addEventListener("contextmenu", e=>e.preventDefault());
  bubble.addEventListener("keydown", e=>{
    if(e.repeat) return;
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); start(); }
  });
  bubble.addEventListener("keyup", e=>{
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); stop(); }
  });
  bubble.addEventListener("blur", stop);
}

function wireDrop(root){
  const wrap=root.querySelector(".ds-drop");
  const card=wrap.querySelector(".ds-drop-card");
  const input=wrap.querySelector(".ds-drop-input");
  const nameEl=wrap.querySelector(".ds-drop-file-name");
  const outEl=wrap.querySelector(".ds-drop-file-out");
  const sizeEl=wrap.querySelector(".ds-drop-file-size");
  const clearBtn=wrap.querySelector(".ds-drop-clear");
  const fileIc=wrap.querySelector(".ds-drop-mark .file-ic");
  let dragDepth=0;
  let reelTimer=0;
  let compressTimer=0;
  let popTimer=0;
  let filled=false;

  function fmtSize(n){
    if(n<1024) return n+" B";
    if(n<1024*1024) return (n/1024).toFixed(n<10*1024?1:0)+" KB";
    return (n/(1024*1024)).toFixed(1)+" MB";
  }
  function iconFor(name){
    const ext=(name.split(".").pop()||"").toLowerCase();
    if(["png","jpg","jpeg","gif","webp","svg"].includes(ext)) return "ti ti-photo file-ic";
    if(["mp4","mov","webm"].includes(ext)) return "ti ti-movie file-ic";
    if(["mp3","wav","aac"].includes(ext)) return "ti ti-music file-ic";
    if(["zip","rar","7z"].includes(ext)) return "ti ti-file-zip file-ic";
    if(ext==="pdf") return "ti ti-file-type-pdf file-ic";
    return "ti ti-file file-ic";
  }
  function reelName(next){
    const prev=nameEl.textContent||"";
    if(reduceMotion || !prev || prev===next){
      nameEl.textContent=next;
      outEl.textContent="";
      wrap.classList.remove("is-reel-up");
      return;
    }
    clearTimeout(reelTimer);
    wrap.classList.remove("is-reel-up");
    outEl.textContent=prev;
    nameEl.textContent=next;
    void wrap.offsetWidth;
    wrap.classList.add("is-reel-up");
    reelTimer=setTimeout(()=>{
      wrap.classList.remove("is-reel-up");
      outEl.textContent="";
    }, 400);
  }
  function land(file){
    const nextName=file && file.name ? file.name : "untitled";
    const nextSize=file && typeof file.size==="number" ? fmtSize(file.size) : "";
    const wasFilled=filled;
    wrap.classList.remove("is-armed");
    dragDepth=0;
    const finish=()=>{
      wrap.classList.remove("is-compress");
      wrap.classList.add("is-filled");
      filled=true;
      if(fileIc) fileIc.className=iconFor(nextName);
      sizeEl.textContent=nextSize;
      if(wasFilled) reelName(nextName);
      else{
        nameEl.textContent=nextName;
        outEl.textContent="";
      }
      clearBtn.tabIndex=0;
      card.setAttribute("aria-label","File ready: "+nextName+". Press delete or clear to remove.");
      if(!reduceMotion){
        wrap.classList.remove("is-pop");
        void wrap.offsetWidth;
        wrap.classList.add("is-pop");
        clearTimeout(popTimer);
        popTimer=setTimeout(()=>wrap.classList.remove("is-pop"), 560);
      }
    };
    if(!reduceMotion){
      wrap.classList.add("is-compress");
      clearTimeout(compressTimer);
      compressTimer=setTimeout(finish, 160);
    }else finish();
  }
  function reset(){
    filled=false;
    wrap.classList.remove("is-filled","is-armed","is-compress","is-reel-up","is-pop");
    nameEl.textContent="";
    outEl.textContent="";
    sizeEl.textContent="";
    if(fileIc) fileIc.className="ti ti-file file-ic";
    if(input) input.value="";
    clearBtn.tabIndex=-1;
    card.setAttribute("aria-label","Drop a file or click to browse");
  }

  ["dragenter","dragover"].forEach(ev=>{
    card.addEventListener(ev,e=>{
      e.preventDefault();
      e.stopPropagation();
      if(ev==="dragenter") dragDepth++;
      if(!filled) wrap.classList.add("is-armed");
    });
  });
  card.addEventListener("dragleave",e=>{
    e.preventDefault();
    dragDepth=Math.max(0,dragDepth-1);
    if(dragDepth===0) wrap.classList.remove("is-armed");
  });
  card.addEventListener("drop",e=>{
    e.preventDefault();
    e.stopPropagation();
    dragDepth=0;
    wrap.classList.remove("is-armed");
    const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) land(f);
  });
  card.addEventListener("click",e=>{
    if(e.target.closest && e.target.closest(".ds-drop-clear")) return;
    if(filled) return;
    input.click();
  });
  card.addEventListener("keydown",e=>{
    if(filled && (e.key==="Backspace"||e.key==="Delete")){
      e.preventDefault();
      reset();
      return;
    }
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      if(filled) return;
      input.click();
    }
  });
  input.addEventListener("change",()=>{
    const f=input.files && input.files[0];
    if(f) land(f);
  });
  clearBtn.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();
    reset();
  });
}

function wirePulse(root){
  const wrap=root.querySelector(".ds-pulse");
  const valEl=wrap.querySelector(".ds-pulse-value");
  const outEl=wrap.querySelector(".ds-pulse-out");
  const nameEl=wrap.querySelector(".ds-pulse-dayname");
  const cols=[...wrap.querySelectorAll(".ds-pulse-col")];
  const vals=cols.map(c=>parseInt(c.getAttribute("data-val"),10));
  const names=cols.map(c=>c.getAttribute("data-name"));
  let active=cols.findIndex(c=>c.classList.contains("is-on"));
  if(active<0) active=vals.indexOf(Math.max.apply(null,vals));
  let reelTimer=0;
  function reel(prev, next){
    if(reduceMotion || prev===next){
      valEl.textContent=String(next);
      outEl.textContent="";
      wrap.classList.remove("is-reel-up","is-reel-down");
      return;
    }
    clearTimeout(reelTimer);
    wrap.classList.remove("is-reel-up","is-reel-down");
    outEl.textContent=String(prev);
    valEl.textContent=String(next);
    void wrap.offsetWidth;
    wrap.classList.add(next>prev ? "is-reel-up" : "is-reel-down");
    reelTimer=setTimeout(()=>{
      wrap.classList.remove("is-reel-up","is-reel-down");
      outEl.textContent="";
    }, 360);
  }
  function select(i){
    if(i===active) return;
    const prev=vals[active];
    active=i;
    cols.forEach((c,j)=>{
      const on=j===i;
      c.classList.toggle("is-on", on);
      c.setAttribute("aria-pressed", on?"true":"false");
    });
    if(nameEl) nameEl.textContent=names[i];
    wrap.classList.add("is-active","has-sel");
    reel(prev, vals[i]);
  }
  cols.forEach((c,i)=>{
    c.addEventListener("pointerenter",()=>select(i));
    c.addEventListener("focus",()=>select(i));
    c.addEventListener("click",()=>select(i));
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add("is-in")));
}

  let dragging=false, x=0, max=0, unlocked=false, resetTimer=0, raf=0, popTimer=0;
  const EDGE=4, THUMB=48, THRESH=0.82;
  function measure(){ max=Math.max(0, track.clientWidth - THUMB - EDGE*2); }
  function progress(){ return max>0 ? x/max : 0; }
  function paint(pos){
    x=Math.max(0, Math.min(max, pos));
    const p=progress();
    wrap.style.setProperty("--up", p.toFixed(4));
    thumb.style.transform="translateX("+x+"px)";
    if(!unlocked){
      fill.style.width=(x<=0 ? 0 : (EDGE + x + THUMB))+"px";
    }
  }
  function armed(){ return max>0 && progress() >= THRESH; }
  function updateArmed(){
    wrap.classList.toggle("is-armed", armed() && !unlocked);
  }
  function home(animate){
    wrap.classList.remove("is-dragging","is-armed");
    cancelAnimationFrame(raf);
    if(!animate || reduce){
      paint(0);
      return;
    }
    const sx=x, t0=performance.now(), DUR=520;
    function frame(t){
      const u=Math.min(1,(t-t0)/DUR);
      const c1=1.75, c3=c1+1;
      const e=1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);
      paint(sx*(1-e));
      if(u<1) raf=requestAnimationFrame(frame);
      else{
        paint(0);
        }
    }
    raf=requestAnimationFrame(frame);
  }
  function celebrate(){
    if(reduce || typeof confetti!=="function") return;
    const r=track.getBoundingClientRect();
    const cx=(r.left+r.right)/2/window.innerWidth;
    const cy=(r.top+r.bottom)/2/window.innerHeight;
    confetti({
      particleCount:28,
      spread:46,
      startVelocity:22,
      scalar:.7,
      ticks:90,
      origin:{x:cx,y:cy},
      colors:[getComputedStyle(document.documentElement).getPropertyValue("--ds-accent").trim()||"#2e6b5c","#ffffff","#c8e6dc"]
    });
  }
  function unlock(){
    unlocked=true;
    wrap.classList.remove("is-dragging","is-armed");
    wrap.classList.add("is-unlocked","is-success-pop");
    measure();
    paint(max);
    fill.style.width="100%";
    thumb.setAttribute("aria-label","Unlocked");
    celebrate();
    clearTimeout(popTimer);
    popTimer=setTimeout(()=>wrap.classList.remove("is-success-pop"), 480);
    clearTimeout(resetTimer);
    resetTimer=setTimeout(()=>{
      unlocked=false;
      wrap.classList.remove("is-unlocked","is-success-pop");
      thumb.setAttribute("aria-label","Slide to unlock");
      paint(0);
    }, 2200);
  }
  function posFromEvent(e){
    measure();
    const rect=track.getBoundingClientRect();
    let nx = e.clientX - rect.left - EDGE - THUMB/2;
    nx = Math.max(0, Math.min(max, nx));
    // soft magnetic pull once you're most of the way there
    if(max>0){
      const p=nx/max;
      if(p>0.68 && p<THRESH){
        const target=max*THRESH;
        nx = nx + (target-nx)*0.18;
      }
    }
    return nx;
  }
  thumb.addEventListener("pointerdown",e=>{
    if(unlocked) return;
    dragging=true;
    cancelAnimationFrame(raf);
    wrap.classList.add("is-dragging");
    thumb.setPointerCapture(e.pointerId);
    paint(posFromEvent(e));
    updateArmed();
  });
  thumb.addEventListener("pointermove",e=>{
    if(!dragging||unlocked)return;
    paint(posFromEvent(e));
    updateArmed();
  });
  function end(){
    if(!dragging)return;
    dragging=false;
    wrap.classList.remove("is-dragging");
    if(armed()) unlock();
    else home(true);
  }
  thumb.addEventListener("pointerup",end);
  thumb.addEventListener("pointercancel",end);
  measure();
  paint(0);
}



window.vrSound=(function(){
  let ctx=null, out=null;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ac(){
    if(ctx) return ctx;
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    ctx=new C();
    out=ctx.createGain();
    out.gain.value=0.048;
    out.connect(ctx.destination);
    return ctx;
  }
  function wake(){
    const c=ac();
    if(c && c.state==="suspended") c.resume();
    return c;
  }
  document.addEventListener("pointerdown", wake, {capture:true, passive:true});
  function tone(opts){
    const t=opts.t, dur=opts.dur, f=opts.f, f2=opts.f2, peak=opts.peak, type=opts.type||"sine";
    const o=ctx.createOscillator();
    o.type=type;
    o.frequency.setValueAtTime(f, t);
    if(f2!=null) o.frequency.exponentialRampToValueAtTime(Math.max(40,f2), t+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t+dur+0.02);
  }
  function noise(opts){
    const t=opts.t, dur=opts.dur, peak=opts.peak, hp=opts.hp||1600;
    const n=ctx.createBufferSource();
    const len=Math.max(1, Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1, len, ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 0.45);
    n.buffer=buf;
    const f=ctx.createBiquadFilter();
    f.type="highpass"; f.frequency.value=hp;
    const g=ctx.createGain();
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    n.connect(f); f.connect(g); g.connect(out);
    n.start(t); n.stop(t+dur+0.02);
  }
  function go(fn){
    if(!wake()) return;
    if(document.hidden) return;
    fn(ctx.currentTime);
  }
  function hueOf(hex){
    if(typeof hex==="number") return ((hex%360)+360)%360;
    const m=/^#?([0-9a-fA-F]{6})$/.exec(String(hex||""));
    if(!m) return 140;
    const n=parseInt(m[1],16);
    const r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    if(d<1e-6) return 0;
    let h=0;
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    return ((h*60)+360)%360;
  }
  return {
    tick:function(p){
      const r=p||1;
      go(function(t){
        noise({t:t, dur:0.016, peak:0.14, hp:2400});
        tone({f:1180*r, f2:900*r, t:t, dur:0.048, peak:0.16, type:"triangle"});
      });
    },
    open:function(){
      go(function(t){
        noise({t:t, dur:0.045, peak:0.06, hp:1100});
        tone({f:340, f2:510, t:t, dur:0.075, peak:0.11, type:"sine"});
      });
    },
    close:function(){
      go(function(t){
        tone({f:400, f2:250, t:t, dur:0.065, peak:0.09, type:"sine"});
      });
    },
    ping:function(hex){
      go(function(t){
        const hue=hueOf(hex);
        const f=312*Math.pow(2, hue/360);
        noise({t:t, dur:0.012, peak:0.08, hp:2600});
        tone({f:f, f2:f*0.96, t:t, dur:0.085, peak:0.13, type:"sine"});
        tone({f:f*2.02, t:t, dur:0.04, peak:0.035, type:"sine"});
      });
    },
    done:function(){
      go(function(t){
        tone({f:523.25, t:t, dur:0.08, peak:0.12, type:"sine"});
        tone({f:783.99, t:t+0.068, dur:0.11, peak:0.14, type:"sine"});
      });
    },
    err:function(){
      go(function(t){
        tone({f:208, f2:174, t:t, dur:0.1, peak:0.11, type:"triangle"});
      });
    },
    sheet:function(opening){
      if(reduce) return;
      go(function(t){
        noise({t:t, dur:0.07, peak:opening?0.045:0.035, hp:opening?800:520});
      });
    },
    honk:function(rage){
      const r=Math.max(0,Math.min(1,rage||0));
      go(function(t){
        const a=280+r*40, b=190+r*20;
        tone({f:a, f2:a*0.92, t:t, dur:0.09, peak:0.16+r*0.04, type:"sawtooth"});
        tone({f:b, f2:b*0.88, t:t+0.07, dur:0.12, peak:0.18+r*0.05, type:"sawtooth"});
        noise({t:t, dur:0.03, peak:0.05, hp:900});
      });
    }
  };
})();


(function initDensity(){
  const btn=document.getElementById("densityBtn");
  const gal=document.getElementById("gallery");
  if(!btn||!gal) return;
  const cycle=[4,2,1];
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cols=4;
  try{
    const q=parseInt(new URL(location.href).searchParams.get("density")||"",10);
    if(cycle.includes(q)) cols=q;
    else {
      const saved=parseInt(localStorage.getItem("vr-density")||"4",10);
      if(cycle.includes(saved)) cols=saved;
    }
  }catch(e){}

  function relabel(n){
    btn.dataset.density=String(n);
    btn.setAttribute("aria-label","Density "+n+" across. Click to change.");
  }

  function apply(n, animate){
    const tiles=[...gal.querySelectorAll(".tile")];
    let first=null;
    if(animate && !reduce){
      first=tiles.map(el=>({el, r:el.getBoundingClientRect()}));
    }
    galleryCols=n;
    gal.dataset.density=String(n);
    tiles.forEach((el,i)=>{ el.dataset.col=String(i%n); });
    relabel(n);
    try{ localStorage.setItem("vr-density", String(n)); }catch(e){}
    syncShareUrl();

    if(!first) return;
    tiles.forEach((el,i)=>{
      const f=first[i].r;
      const last=el.getBoundingClientRect();
      if(!f.width||!last.width) return;
      const dx=f.left-last.left;
      const dy=f.top-last.top;
      const sx=f.width/last.width;
      const sy=f.height/last.height;
      if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5 && Math.abs(sx-1)<0.01 && Math.abs(sy-1)<0.01) return;
      el.classList.add("is-flipping");
      el.style.transformOrigin="top left";
      el.style.transition="none";
      el.style.transform="translate("+dx+"px,"+dy+"px) scale("+sx+","+sy+")";
      requestAnimationFrame(()=>{
        void el.offsetWidth;
        el.style.transition="transform .5s cubic-bezier(.22,1,.36,1)";
        el.style.transform="";
      });
      const done=()=>{
        el.style.transition="";
        el.style.transformOrigin="";
        el.classList.remove("is-flipping");
        el.removeEventListener("transitionend", done);
      };
      el.addEventListener("transitionend", done);
      setTimeout(done, 560);
    });
  }

  apply(cols, false);

  btn.addEventListener("click", ()=>{
    const idx=cycle.indexOf(galleryCols);
    const next=cycle[(idx+1)%cycle.length];
    btn.classList.remove("is-pop");
    void btn.offsetWidth;
    btn.classList.add("is-pop");
    apply(next, true);
    if(window.vrSound) vrSound.tick(next===4?1.14:next===2?0.94:0.76);
  });
})();

(function initAccent(){
  const presets=[
    {id:"sage", hex:"#2e6b5c", hover:"#275e51", done:"#3a7d6c"},
    {id:"blue", hex:"#2f5d9f", hover:"#274d86", done:"#3d73bc"},
    {id:"clay", hex:"#a65d3f", hover:"#8f4f35", done:"#c07352"},
    {id:"violet", hex:"#6554a3", hover:"#57468a", done:"#7e6bb8"},
    {id:"ink", hex:"#1f1c1a", hover:"#141211", done:"#3a3632"}
  ];
  const root=document.documentElement;
  const fab=document.getElementById("accentFab");
  const chip=document.getElementById("accentChip");
  const host=document.getElementById("accentSwatches");
  const picker=document.getElementById("accentPicker");
  const sv=document.getElementById("accentSv");
  const svThumb=document.getElementById("accentSvThumb");
  const hueEl=document.getElementById("accentHue");
  const hueThumb=document.getElementById("accentHueThumb");
  const hexInput=document.getElementById("accentHex");
  const hexPreview=document.getElementById("accentHexPreview");
  if(!fab||!chip||!host||!picker||!sv||!hueEl||!hexInput)return;

  let activeKind="preset", activeId="sage";
  let H=152, S=0.56, V=0.42;
  let picking=false;

  function hexToRgb(hex){
    let hh=hex.replace("#","");
    if(hh.length===3) hh=hh.split("").map(c=>c+c).join("");
    return [parseInt(hh.slice(0,2),16),parseInt(hh.slice(2,4),16),parseInt(hh.slice(4,6),16)];
  }
  function rgbToHex(r,g,b){
    return "#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("");
  }
  function hsvToRgb(h,s,v){
    const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
    let rp=0,gp=0,bp=0;
    if(h<60){rp=c;gp=x;}
    else if(h<120){rp=x;gp=c;}
    else if(h<180){gp=c;bp=x;}
    else if(h<240){gp=x;bp=c;}
    else if(h<300){rp=x;bp=c;}
    else{rp=c;bp=x;}
    return [(rp+m)*255,(gp+m)*255,(bp+m)*255];
  }
  function rgbToHsv(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h=0;
    if(d!==0){
      if(max===r) h=((g-b)/d)%6;
      else if(max===g) h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h*=60; if(h<0) h+=360;
    }
    const s=max===0?0:d/max;
    return [h,s,max];
  }
  function shade(hex, factor){
    const [r,g,b]=hexToRgb(hex);
    const t=factor<1?0:255;
    const p=factor<1?1-factor:factor-1;
    return rgbToHex((t-r)*p+r,(t-g)*p+g,(t-b)*p+b);
  }
  function currentHex(){
    const [r,g,b]=hsvToRgb(H,S,V);
    return rgbToHex(r,g,b);
  }
  function syncPickerUI(){
    const hueColor=rgbToHex(...hsvToRgb(H,1,1));
    sv.style.background=hueColor;
    svThumb.style.left=(S*100)+"%";
    svThumb.style.top=((1-V)*100)+"%";
    svThumb.style.background=currentHex();
    hueThumb.style.left=((H/360)*100)+"%";
    const hex=currentHex().toUpperCase();
    hexInput.value=hex;
    if(hexPreview) hexPreview.style.background=hex;
  }
  function syncActive(){
    host.querySelectorAll(".accent-swatch").forEach(btn=>{
      const isPreset=btn.dataset.id && activeKind==="preset" && btn.dataset.id===activeId;
      const isCustom=btn.dataset.role==="custom" && activeKind==="custom";
      const on=!!(isPreset||isCustom);
      btn.classList.toggle("is-active", on);
      btn.setAttribute("aria-pressed", on?"true":"false");
      if(btn.dataset.role==="custom"){
        const filled = activeKind==="custom";
        btn.classList.toggle("is-custom-color", filled);
        const icon=btn.querySelector(".ti");
        if(icon){
          // custom selected: show check on the live color; otherwise palette affordance
          icon.className = filled ? "ti ti-check" : "ti ti-palette";
        }
      }
    });
  }
  function applyHex(hex, meta, fromPicker){
    if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    const [r,g,b]=hexToRgb(hex);
    if(!fromPicker){
      const hsv=rgbToHsv(r,g,b);
      H=hsv[0]; S=hsv[1]; V=hsv[2];
    }
    const hover=meta&&meta.hover?meta.hover:shade(hex,0.86);
    const done=meta&&meta.done?meta.done:shade(hex,1.12);
    root.style.setProperty("--ds-accent", hex);
    root.style.setProperty("--ds-accent-hover", hover);
    root.style.setProperty("--ds-accent-done", done);
    root.style.setProperty("--ds-focus", "rgba("+r+","+g+","+b+",.18)");
    root.style.setProperty("--accent", hex);
    if(meta&&meta.id){ activeKind="preset"; activeId=meta.id; }
    else { activeKind="custom"; activeId="custom"; }
    syncActive();
    syncPickerUI();
    shareAccent=hex.replace("#","").toLowerCase();
    syncShareUrl();
  }
  function persist(kind, value){
    try{ localStorage.setItem("vr-accent", JSON.stringify({kind,value})); }catch(e){}
  }
  function setPicking(on){
    picking=on;
    fab.classList.toggle("is-picking", on);
    if(on){ picker.hidden=false; syncPickerUI(); }
    else { picker.hidden=true; }
  }
  function open(){
    fab.classList.add("is-open");
    chip.classList.add("is-open");
    chip.setAttribute("aria-expanded","true");
    if(window.vrSound) vrSound.open();
  }
  function close(){
    const was=fab.classList.contains("is-open");
    fab.classList.remove("is-open");
    chip.classList.remove("is-open");
    chip.setAttribute("aria-expanded","false");
    setPicking(false);
    if(was && window.vrSound) vrSound.close();
  }
  function toggle(){ fab.classList.contains("is-open")?close():open(); }

  presets.forEach(sw=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="accent-swatch";
    btn.dataset.id=sw.id;
    btn.title=sw.id;
    btn.setAttribute("aria-label","Accent "+sw.id);
    btn.setAttribute("aria-pressed","false");
    btn.style.background=sw.hex;
    btn.innerHTML='<i class="ti ti-check" aria-hidden="true"></i>';
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      setPicking(false);
      applyHex(sw.hex, sw);
      persist("preset", sw.id);
      if(window.vrSound) vrSound.ping(sw.hex);
    });
    host.appendChild(btn);
  });

  const toolBtn=document.createElement("button");
  toolBtn.type="button";
  toolBtn.className="accent-swatch accent-swatch-tool";
  toolBtn.dataset.role="custom";
  toolBtn.title="Custom";
  toolBtn.setAttribute("aria-label","Custom accent");
  toolBtn.setAttribute("aria-pressed","false");
  toolBtn.innerHTML='<i class="ti ti-palette" aria-hidden="true"></i>';
  toolBtn.addEventListener("click",e=>{
    e.stopPropagation();
    if(activeKind!=="custom"){
      // adopt current hex as custom and open picker
      setPicking(true);
      applyHex(currentHex(), null, true);
      persist("custom", currentHex());
      return;
    }
    // already custom: toggle picker to edit
    setPicking(!picking);
  });
  host.appendChild(toolBtn);

  function bindDrag(el, onMove){
    let down=false;
    function move(ev){
      if(!down)return;
      onMove(ev);
      ev.preventDefault();
    }
    function up(){ down=false; window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); if(window.vrSound) vrSound.ping(H); }
    el.addEventListener("pointerdown",ev=>{
      down=true;
      if(el.setPointerCapture) el.setPointerCapture(ev.pointerId);
      onMove(ev);
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      ev.preventDefault();
      ev.stopPropagation();
    });
  }
  bindDrag(sv, ev=>{
    const rect=sv.getBoundingClientRect();
    S=Math.max(0, Math.min(1, (ev.clientX-rect.left)/rect.width));
    V=Math.max(0, Math.min(1, 1-(ev.clientY-rect.top)/rect.height));
    const hex=currentHex();
    applyHex(hex, null, true);
    persist("custom", hex);
  });
  bindDrag(hueEl, ev=>{
    const rect=hueEl.getBoundingClientRect();
    H=Math.max(0, Math.min(359.99, ((ev.clientX-rect.left)/rect.width)*360));
    const hex=currentHex();
    applyHex(hex, null, true);
    persist("custom", hex);
  });
  hexInput.addEventListener("input",e=>{
    let v=e.target.value.trim();
    if(v[0]!=="#") v="#"+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){
      applyHex(v, null);
      persist("custom", v);
      setPicking(true);
    }
  });
  hexInput.addEventListener("click",e=>e.stopPropagation());

  chip.addEventListener("click",e=>{ e.stopPropagation(); toggle(); });
  document.addEventListener("click",e=>{
    if(!fab.classList.contains("is-open"))return;
    if(fab.contains(e.target))return;
    close();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });

  let startHex=presets[0].hex, startMeta=presets[0];
  try{
    const aq=(new URL(location.href).searchParams.get("accent")||"").replace("#","");
    if(/^[0-9a-fA-F]{6}$/.test(aq)){
      const hex="#"+aq.toLowerCase();
      const found=presets.find(s=>s.hex.toLowerCase()===hex);
      if(found){ startHex=found.hex; startMeta=found; }
      else { startHex=hex; startMeta=null; }
    }else{
      const saved=JSON.parse(localStorage.getItem("vr-accent")||"null");
      if(saved&&saved.kind==="preset"){
        const found=presets.find(s=>s.id===saved.value);
        if(found){ startHex=found.hex; startMeta=found; }
      }else if(saved&&saved.kind==="custom"&&/^#[0-9a-fA-F]{6}$/.test(saved.value)){
        startHex=saved.value; startMeta=null;
      }
    }
  }catch(e){}
  applyHex(startHex, startMeta);
})();

    chip.setAttribute("aria-expanded","false");
    document.documentElement.classList.remove("is-mail-open");
    if(was && window.vrSound) vrSound.close();
  }
  function open(){
    closeAccent();
    fab.classList.add("is-open");
    chip.classList.add("is-open");
    chip.setAttribute("aria-expanded","true");
    document.documentElement.classList.add("is-mail-open");
    if(window.vrSound) vrSound.open();
    const input=document.getElementById("mailEmail");
    const coarse=window.matchMedia("(pointer:coarse)").matches;
    if(input && !coarse) setTimeout(function(){ input.focus(); }, 40);
  }
  function toggle(){ fab.classList.contains("is-open")?close():open(); }
  function markOn(){
    try{ localStorage.setItem(KEY,"1"); }catch(e){}
    chip.textContent="Subscribed";
    chip.classList.add("is-on");
    fab.classList.add("is-on");
    chip.setAttribute("aria-expanded","false");
    fab.classList.remove("is-open");
    chip.classList.remove("is-open");
    document.documentElement.classList.remove("is-mail-open");
    hideMailAsk();
  }
  function applyOnState(){
    if(!isOn()) return;
    chip.textContent="Subscribed";
    chip.classList.add("is-on");
    fab.classList.add("is-on");
    chip.setAttribute("aria-expanded","false");
    hideMailAsk();
  }
  async function send(form, note){
    const emailInput=form.querySelector('input[type="email"]');
    const hp=form.querySelector(".mail-hp");
    const go=form.querySelector(".mail-go");
    const email=(emailInput && emailInput.value || "").trim();
    const company=hp ? hp.value : "";
    if(go) go.disabled=true;
    setNote(note, "Sending.");
    function ok(){
      markOn();
      setNote(note, "Sent. Check your inbox.");
      if(window.vrSound) vrSound.done();
    }
    if(company){ ok(); return; }
    try{
      const res=await fetch("/api/subscribe",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email, day: shareDay || pendingDay || null, company})
      });
      if(res.ok || res.status===409){ ok(); return; }
      let already=false;
      try{
        const data=await res.json();
        if(data && (data.already || data.status==="already" || data.error==="already")) already=true;
      }catch(e){}
      if(already){ ok(); return; }
      setNote(note, "Couldn't send. Try again.");
      if(go) go.disabled=false;
      if(window.vrSound) vrSound.err();
    }catch(e){
      setNote(note, "Couldn't send. Try again.");
      if(go) go.disabled=false;
      if(window.vrSound) vrSound.err();
    }
  }
  function bind(form, note){
    if(!form) return;
    form.addEventListener("submit", function(e){
      e.preventDefault();
      send(form, note);
    });
  }

  applyOnState();
  bind(panel, noteEl);

  chip.addEventListener("click", function(e){
    e.stopPropagation();
    if(isOn()){
      setNote(noteEl, "You're on the list.");
      fab.classList.add("is-open");
      chip.setAttribute("aria-expanded","false");
      if(onNoteTimer) clearTimeout(onNoteTimer);
      onNoteTimer=setTimeout(function(){
        fab.classList.remove("is-open");
        setNote(noteEl, "");
      }, 1000);
      return;
    }
    toggle();
  });
  document.addEventListener("click", function(e){
    if(!fab.classList.contains("is-open")) return;
    if(fab.contains(e.target)) return;
    close();
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape") close();
  });
})();

if(shareLinkBtn){
  shareLinkBtn.addEventListener("click",()=>{
    syncShareUrl();
    copyText(location.href, shareLinkBtn, "Copy link");
  });
}
(function initDeepLink(){
  try{
    const day=parsePieceFromUrl();
    if(!day) { syncShareUrl(); return; }
    const id="day-"+String(day).padStart(2,"0");
    const p=pieces.find(x=>x.id===id);
    const btn=gallery.querySelector('.tile[data-id="'+id+'"]');
    if(p&&btn) openPiece(p,btn);
    else syncShareUrl();
  }catch(e){ syncShareUrl(); }
})();
</script>
